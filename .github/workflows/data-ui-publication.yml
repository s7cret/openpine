name: Verify native data context and parity UI before publication
'on':
  push:
    branches: ['ops/rc6-data-ui-20260905']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: rc6-data-ui-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          repository: s7cret/marketdata-provider
          ref: 64ea47fcfc078b3b33fa09720208885f0bc3bd4c
          path: publisher-source
          sparse-checkout: .github/data-ui/restore.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: cp publisher-source/.github/data-ui/restore.py "$RUNNER_TEMP/restore.py"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Restore exact source commits
        run: |
          python "$RUNNER_TEMP/restore.py" restore .github/data-ui/manifest.json "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/restore.py" "$RUNNER_TEMP/evidence/restore.py"
      - name: Install clean copies of exact sibling sources
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0 hatchling==1.32.0 build==1.6.0
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'stack'
          evidence = root.parent / 'evidence'
          root.mkdir()
          pins = json.loads(pathlib.Path('docs/RC6_LIFECYCLE_SOURCES.json').read_text())
          expected = {'openpine-contracts','pine2ast','ast2python','pinelib','backtest_engine','marketdata-provider','optimizer'}
          if set(pins) != expected or not all(re.fullmatch('[0-9a-f]{40}', sha) for sha in pins.values()):
              raise SystemExit('Invalid source pins')
          sources = []
          build_root = root.parent / 'install-sources'
          build_root.mkdir()
          for name, sha in pins.items():
              path = root / name
              subprocess.run(['git','clone','--quiet','https://github.com/s7cret/'+name+'.git',str(path)],check=True)
              subprocess.run(['git','-C',str(path),'checkout','--detach',sha],check=True)
              if subprocess.check_output(['git','-C',str(path),'rev-parse','HEAD'],text=True).strip() != sha:
                  raise SystemExit('Source identity mismatch')
              clean = build_root / name
              clean.mkdir()
              archive = subprocess.check_output(['git','-C',str(path),'archive',sha])
              subprocess.run(['tar','-x','-C',str(clean)],input=archive,check=True)
              sources.append(str(clean) + ('[parquet,stream,zstd]' if name == 'marketdata-provider' else ''))
          subprocess.run(['python','-m','pip','install',*sources,'.[dev]'],check=True)
          (evidence / 'source-pins.json').write_text(json.dumps(pins,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('PINE_STACK_ROOT='+str(root)+'\n')
          PY
      - name: Complete runtime compiler contracts and broker functional suites
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          for repo in openpine-contracts pinelib ast2python backtest_engine; do
            (cd "$PINE_STACK_ROOT/$repo" && python -m pytest -q --junitxml="$RUNNER_TEMP/evidence/$repo.xml")
          done
      - name: Deterministic provider suite with all offline extras
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          cd "$PINE_STACK_ROOT/marketdata-provider"
          python -m pytest -q -m 'not live_network' --junitxml="$RUNNER_TEMP/evidence/marketdata-provider.xml"
      - name: Enable real protected worker environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y apparmor-profiles apparmor-utils bubblewrap
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          if ! getent passwd openpine-worker >/dev/null; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin openpine-worker
          fi
          sudo -n -u openpine-worker -- /usr/bin/id -u
          /usr/bin/bwrap --ro-bind / / --unshare-net -- /usr/bin/true
      - name: Native sandbox and explicit OpenPine regression suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence'
          selected = json.loads(pathlib.Path('rc6_tests/selected_regressions.json').read_text())
          if (not isinstance(selected,list) or len(set(selected)) != len(selected)
                  or any(not isinstance(p,str) or not p.startswith('tests/test_')
                         or not p.endswith('.py') or not pathlib.Path(p).is_file() for p in selected)):
              raise SystemExit('Invalid explicit regression inventory')
          (evidence/'selected-tests.json').write_text(json.dumps(sorted(selected),indent=2)+'\n')
          subprocess.run(['python','-m','pytest','-p','pytest_asyncio.plugin','-q','rc6_tests',*sorted(selected),
                          '--junitxml='+str(evidence/'openpine.xml')],check=True)
          PY
      - name: Lint changed runtime and build clean distributions
        run: |
          python -m ruff check openpine/runtime/rc6_worker_runtime.py rc6_tests/test_rc6_chart_metadata.py
          python -m compileall -q openpine
          mkdir -p "$RUNNER_TEMP/build-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/build-source"
          python -m build --no-isolation --outdir "$RUNNER_TEMP/evidence/dist" "$RUNNER_TEMP/build-source"
          python -m pip freeze > "$RUNNER_TEMP/evidence/environment.txt"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-ui-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: s7cret/marketdata-provider
          ref: 64ea47fcfc078b3b33fa09720208885f0bc3bd4c
          path: publisher-source
          sparse-checkout: .github/data-ui/restore.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: cp publisher-source/.github/data-ui/restore.py "$RUNNER_TEMP/restore.py"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the same verified source candidate
        run: python "$RUNNER_TEMP/restore.py" restore .github/data-ui/manifest.json "$RUNNER_TEMP/evidence"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: openpine-ui/package-lock.json
      - run: npm ci
        working-directory: openpine-ui
      - name: Complete unit and Vue lifecycle tests
        working-directory: openpine-ui
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/evidence/ui.xml"
      - name: Type check and production frontend build
        working-directory: openpine-ui
        run: npm run build | tee "$RUNNER_TEMP/evidence/ui-build.log"
      - name: Node regressions against the actual production build
        working-directory: openpine-ui
        run: npm run test:node | tee "$RUNNER_TEMP/evidence/ui-node.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-ui-frontend-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/evidence/
            openpine-ui/dist/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: [verify, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: data-ui-3.13-${{ github.run_id }}
          path: evidence
      - name: Fast-forward tested RC6 and archive the temporary branch
        run: python evidence/restore.py publish evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-ui-publication-${{ github.run_id }}
          path: evidence/
          retention-days: 30
