name: Verify price-entry brackets across the pinned stack before publication
'on':
  push:
    branches: ['ops/rc6-price-exits-20260906']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: reviewed-rc6-price-exits
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cc5f8d116660d40c6e42ffa1feef3cbcaada7d9e
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the exact candidate and sibling source set
        run: |
          test "$(git rev-parse HEAD)" = cc5f8d116660d40c6e42ffa1feef3cbcaada7d9e
          python -m pip install setuptools==84.0.0 wheel==0.48.0 hatchling==1.32.0 build==1.6.0
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'stack'
          evidence = root.parent / 'evidence'
          root.mkdir(); evidence.mkdir()
          pins = json.loads(pathlib.Path('docs/RC6_LIFECYCLE_SOURCES.json').read_text())
          expected = {'openpine-contracts','pine2ast','ast2python','pinelib','backtest_engine','marketdata-provider','optimizer'}
          if set(pins) != expected or not all(re.fullmatch('[0-9a-f]{40}', sha) for sha in pins.values()):
              raise SystemExit('Invalid source pins')
          if pins['backtest_engine'] != '891141faf482c76ed1f85a7f4b0076f26ed63336':
              raise SystemExit('Wrong reviewed broker')
          sources = []
          build_root = root.parent / 'install-sources'; build_root.mkdir()
          for name, sha in pins.items():
              path = root / name
              subprocess.run(['git','clone','--quiet','https://github.com/s7cret/'+name+'.git',str(path)],check=True)
              subprocess.run(['git','-C',str(path),'checkout','--detach',sha],check=True)
              if subprocess.check_output(['git','-C',str(path),'rev-parse','HEAD'],text=True).strip() != sha:
                  raise SystemExit('Source identity mismatch')
              clean = build_root / name; clean.mkdir()
              subprocess.run(['tar','-x','-C',str(clean)],input=subprocess.check_output(['git','-C',str(path),'archive',sha]),check=True)
              sources.append(str(clean) + ('[parquet,stream,zstd]' if name == 'marketdata-provider' else '[dev]' if name == 'optimizer' else ''))
          subprocess.run(['python','-m','pip','install',*sources,'.[dev]'],check=True)
          (evidence/'source-pins.json').write_text(json.dumps(pins,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('PINE_STACK_ROOT='+str(root)+'\n')
          PY
      - name: Full contracts runtime compiler broker and optimizer functional suites
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          for repo in openpine-contracts pinelib pine2ast ast2python backtest_engine optimizer; do
            (cd "$PINE_STACK_ROOT/$repo" && python -m pytest -q --junitxml="$RUNNER_TEMP/evidence/$repo.xml")
          done
      - name: Deterministic provider suite with explicit network exclusion
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          cd "$PINE_STACK_ROOT/marketdata-provider"
          python -m pytest -q -m 'not live_network' --junitxml="$RUNNER_TEMP/evidence/marketdata-provider.xml"
      - name: Install the actual protected worker environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y apparmor-profiles apparmor-utils bubblewrap
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          if ! getent passwd openpine-worker >/dev/null; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin openpine-worker
          fi
          sudo -n -u openpine-worker -- /usr/bin/id -u
          /usr/bin/bwrap --ro-bind / / --unshare-net -- /usr/bin/true
      - name: All native tests including six new protected worker cases and affected regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          evidence = pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence'
          selected = json.loads(pathlib.Path('rc6_tests/selected_regressions.json').read_text())
          if (not isinstance(selected,list) or len(set(selected)) != len(selected)
                  or any(not isinstance(p,str) or not p.startswith('tests/test_')
                         or not p.endswith('.py') or not pathlib.Path(p).is_file() for p in selected)):
              raise SystemExit('Invalid explicit regression inventory')
          (evidence/'selected-tests.json').write_text(json.dumps(sorted(selected),indent=2)+'\n')
          subprocess.run(['python','-m','pytest','-p','pytest_asyncio.plugin','-q','rc6_tests',*sorted(selected),
                          '--junitxml='+str(evidence/'openpine.xml')],check=True)
          PY
      - name: Retained lint gates, OpenAPI and clean distributions
        run: |
          python - <<'PY'
          import pathlib, subprocess
          # Execute the exact retained lint command from the reviewed workflow.
          lines=pathlib.Path('.github/workflows/rc6-native.yml').read_text().splitlines()
          commands=[line.strip() for line in lines if line.strip().startswith('python -m ruff check ')]
          assert len(commands)==1
          import shlex
          subprocess.run(shlex.split(commands[0]),check=True)
          PY
          python -m compileall -q openpine
          python scripts/export_openapi.py "$RUNNER_TEMP/evidence/openapi.json"
          mkdir -p "$RUNNER_TEMP/build-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/build-source"
          python -m build --no-isolation --outdir "$RUNNER_TEMP/evidence/dist" "$RUNNER_TEMP/build-source"
          python -m pip freeze > "$RUNNER_TEMP/evidence/environment.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/code-head.txt"
          git update-ref refs/heads/review-candidate HEAD
          git bundle create "$RUNNER_TEMP/evidence/verified.bundle" refs/heads/review-candidate
          git bundle verify "$RUNNER_TEMP/evidence/verified.bundle"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-exits-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30
  frontend:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: openpine-ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cc5f8d116660d40c6e42ffa1feef3cbcaada7d9e
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: price-exits-3.13-${{ github.run_id }}
          path: ${{ runner.temp }}/backend-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: openpine-ui/package-lock.json
      - run: npm ci
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/ui-tests.xml"
      - run: npm run build | tee "$RUNNER_TEMP/ui-build.log"
      - run: npm run test:node | tee "$RUNNER_TEMP/ui-node.log"
        env:
          OPENPINE_OPENAPI_SCHEMA: ${{ runner.temp }}/backend-evidence/openapi.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-exits-ui-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ui-tests.xml
            ${{ runner.temp }}/ui-node.log
            ${{ runner.temp }}/ui-build.log
            openpine-ui/dist/
          retention-days: 30
  publish:
    needs: [verify, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: price-exits-3.13-${{ github.run_id }}
          path: evidence
      - name: Verify exact tested source, fast-forward release and archive maintenance
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          def refs():
              return {ref:sha for sha,ref in (row.split() for row in git('ls-remote','--refs','origin').splitlines())}
          base='f1cf2994a01b7003f976ba62844739dc104d659b'
          head='cc5f8d116660d40c6e42ffa1feef3cbcaada7d9e'
          target='refs/heads/release/5.0.0rc6'
          branch='refs/heads/ops/rc6-price-exits-20260906'
          tag='refs/tags/ops/rc6-price-exits-20260906'
          evidence=pathlib.Path('evidence')
          if os.environ['GITHUB_REPOSITORY']!='s7cret/openpine' or os.environ['GITHUB_REF']!=branch:
              raise SystemExit('Unexpected publication context')
          if (evidence/'code-head.txt').read_text().strip()!=head:
              raise SystemExit('Tested head mismatch')
          git('fetch',str((evidence/'verified.bundle').resolve()),'refs/heads/review-candidate')
          if git('rev-parse','FETCH_HEAD')!=head:
              raise SystemExit('Verified bundle mismatch')
          git('merge-base','--is-ancestor',base,head)
          before=refs(); sha=os.environ['GITHUB_SHA']
          (evidence/'before.json').write_text(json.dumps(before,indent=2)+'\n')
          if before.get(target) not in (base,head):
              raise SystemExit('Release moved concurrently')
          if before[target]!=head:
              git('push','origin',head+':'+target)
          if refs().get(target)!=head:
              raise SystemExit('Published ref mismatch')
          git('push','--atomic',f'--force-with-lease={branch}:{sha}',f'--force-with-lease={tag}:','origin',sha+':'+tag,':'+branch)
          after=refs()
          expected={k:v for k,v in before.items() if k.startswith('refs/heads/') and k!=branch}
          expected[target]=head
          if {k:v for k,v in after.items() if k.startswith('refs/heads/')}!=expected or after.get(tag)!=sha:
              raise SystemExit('Branch preservation/archive verification failed')
          (evidence/'after.json').write_text(json.dumps(after,indent=2)+'\n')
          (evidence/'published-head.txt').write_text(head+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-exits-publication-${{ github.run_id }}
          path: evidence/
          retention-days: 30
