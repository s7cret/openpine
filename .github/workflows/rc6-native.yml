# Native source checks; component success is not stage acceptance.
name: RC6 native and affected-path checks
'on':
  push:
    branches:
    - release/5.0.0rc6
  pull_request:
    branches:
    - release/5.0.0rc6
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: rc6-checks-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python:
        - '3.13'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python }}
    - name: Bootstrap only the planner interface
      run: "python -m pip install --require-hashes --only-binary=:all: -r verification/ci-bootstrap-requirements.txt"
    - name: Build exact eight-package source and wheel bundle; collect full inventories
      run: python -m openpine.verification test-ci prepare --host-root "$GITHUB_WORKSPACE" --work "${{ runner.temp }}/prepare-work" --python-version "${{ matrix.python }}"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: rc6-prepared-${{ matrix.python }}-${{ github.run_id }}
        path: ${{ runner.temp }}/prepare-work/bundle/
        if-no-files-found: error
        retention-days: 7
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: rc6-preparation-logs-${{ matrix.python }}-${{ github.run_id }}
        path: ${{ runner.temp }}/prepare-work/commands/
        if-no-files-found: error
        retention-days: 7
  plan:
    needs:
    - prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.freeze.outputs.matrix }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.13'
    - name: Bootstrap only the planner interface
      run: "python -m pip install --require-hashes --only-binary=:all: -r verification/ci-bootstrap-requirements.txt"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: rc6-prepared-*-${{ github.run_id }}
        path: ${{ runner.temp }}/prepared-lanes
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.13'
    - run: python -m openpine.verification test-ci owner-environment --bundle "$RUNNER_TEMP/prepared-lanes/rc6-prepared-3.13-${{ github.run_id }}" --work "$RUNNER_TEMP/owner-env313"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: openpine-ui/package-lock.json
    - name: Prepare the reviewed browser, not frontend acceptance
      working-directory: openpine-ui
      run: |
        npm ci
        npx playwright install --with-deps chromium
    - id: freeze
      name: Freeze one source-bound plan for all eight component/interpreter tasks
      shell: bash
      run: |-
        set -euo pipefail
        ARGS=()
        for BUNDLE in "$RUNNER_TEMP"/prepared-lanes/*; do ARGS+=(--bundle "$BUNDLE"); done
        python - <<'PYOWNERLOC'
        import json,os,pathlib,shutil,subprocess
        from openpine.verification.execution_ci import make_owner_locations
        from openpine.verification.execution_identity import write_once_json
        root=pathlib.Path(os.environ['RUNNER_TEMP'])
        reports={label:json.loads((root/('owner-env'+label[2:])/'restored.json').read_text()) for label in ('py313',)}
        node=shutil.which('node');npm=shutil.which('npm')
        assert node and npm
        browser=subprocess.check_output([node,'-p','require("@playwright/test").chromium.executablePath()'],cwd=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'openpine-ui',text=True).strip()
        locations=make_owner_locations(reports,stack_root=root/'owner-env313/stack',attempt=root/'exact-owner',package_attempt=root/'package-owner',npm=pathlib.Path(npm),node=pathlib.Path(node),chromium=pathlib.Path(browser))
        write_once_json(root/'plan/owner-locations.json',locations)
        PYOWNERLOC
        python -m openpine.verification test-ci plan "${ARGS[@]}" --work "$RUNNER_TEMP/planner" --output "$RUNNER_TEMP/plan/plan.json" --owner-locations "$RUNNER_TEMP/plan/owner-locations.json"
        python - <<'PYMATRIX'
        import json, os, pathlib
        value=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'plan/matrix.json').read_text())
        assert len(value['include']) == 8
        with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('matrix='+json.dumps(value,separators=(',',':'))+'\n')
        PYMATRIX
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: rc6-plan-${{ github.run_id }}
        path: ${{ runner.temp }}/plan/
        if-no-files-found: error
        retention-days: 7
  component:
    needs:
    - plan
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python }}
    - name: Bootstrap only the planner interface
      run: "python -m pip install --require-hashes --only-binary=:all: -r verification/ci-bootstrap-requirements.txt"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rc6-prepared-${{ matrix.python }}-${{ github.run_id }}
        path: ${{ runner.temp }}/prepared
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rc6-plan-${{ github.run_id }}
        path: ${{ runner.temp }}/plan
    - name: Enable the real protected worker environment
      run: |
        sudo apt-get update -qq
        sudo apt-get install --no-install-recommends -y apparmor-profiles apparmor-utils bubblewrap
        sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
        sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
        if ! getent passwd openpine-worker >/dev/null; then
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin openpine-worker
        fi
        sudo -n -u openpine-worker -- /usr/bin/id -u
        /usr/bin/bwrap --ro-bind / / --unshare-net -- /usr/bin/true
      if: startsWith(matrix.task, 'openpine@')
    - name: Run exact task shards and combine coverage using unchanged owner threshold
      run: python -m openpine.verification test-ci task --bundle "${{ runner.temp }}/prepared" --work "${{ runner.temp }}/restored" --plan "${{ runner.temp }}/plan/plan.json" --task "${{ matrix.task }}" --run-id "rc6-${{ github.run_id }}-${{ github.run_attempt }}" --output "${{ runner.temp }}/fragment"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: rc6-task-${{ matrix.task }}-${{ github.run_id }}
        path: |-
          ${{ runner.temp }}/fragment/
          !${{ runner.temp }}/fragment/**/private/**
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: rc6-command-task-${{ matrix.task }}-${{ github.run_id }}
        path: ${{ runner.temp }}/restored/execute-log/commands/
        if-no-files-found: error
        retention-days: 7
  quality:
    needs:
    - prepare
    - plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.13'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python }}
    - name: Bootstrap only the planner interface
      run: "python -m pip install --require-hashes --only-binary=:all: -r verification/ci-bootstrap-requirements.txt"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rc6-prepared-${{ matrix.python }}-${{ github.run_id }}
        path: ${{ runner.temp }}/prepared
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rc6-plan-${{ github.run_id }}
        path: ${{ runner.temp }}/plan
    - name: Restore exact installed tools
      run: |-
        python -m openpine.verification test-ci restore --bundle "${{ runner.temp }}/prepared" --work "${{ runner.temp }}/restored" --plan "${{ runner.temp }}/plan/plan.json"
        python - <<'PYROOT'
        import json, os, pathlib
        r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'restored/restored.json').read_text())
        with open(os.environ['GITHUB_ENV'],'a') as f:
         f.write('EXACT_PYTHON='+r['executable']+'\n')
         f.write('EXACT_HOST='+r['roots']['openpine']+'\n')
         f.write('PYTHONPATH='+r['roots']['openpine']+'\n')
        PYROOT
    - name: Retained native lint, compileall and OpenAPI checks
      shell: bash
      run: |-
        set -euo pipefail
        export PATH="$(dirname "$EXACT_PYTHON"):$PATH"
        cd "$EXACT_HOST"
        bash scripts/rc6_native_quality.sh
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: rc6-quality-${{ matrix.python }}-${{ github.run_id }}
        path: ${{ runner.temp }}/evidence/
        if-no-files-found: error
        retention-days: 7
  verify:
    name: verify (${{ matrix.python }})
    if: always()
    needs:
    - prepare
    - plan
    - component
    - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.13'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python }}
    - name: Bootstrap only the planner interface
      run: "python -m pip install --require-hashes --only-binary=:all: -r verification/ci-bootstrap-requirements.txt"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rc6-prepared-${{ matrix.python }}-${{ github.run_id }}
        path: ${{ runner.temp }}/prepared
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rc6-plan-${{ github.run_id }}
        path: ${{ runner.temp }}/plan
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: rc6-task-*@*-${{ github.run_id }}
        path: ${{ runner.temp }}/fragments
    - name: Re-read raw phase and coverage receipts; run existing foundation owner
      shell: bash
      run: |-
        set -euo pipefail
        ARGS=()
        for FRAGMENT in "$RUNNER_TEMP"/fragments/*; do ARGS+=(--fragment "$FRAGMENT"); done
        python -m openpine.verification test-ci foundation --bundle "${{ runner.temp }}/prepared" --work "${{ runner.temp }}/restored" --plan "${{ runner.temp }}/plan/plan.json" "${ARGS[@]}" --run-id "rc6-${{ github.run_id }}-${{ github.run_attempt }}" --output "$RUNNER_TEMP/foundation"
        python - <<'PYROOT'
        import json, os, pathlib
        r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'restored/restored.json').read_text())
        with open(os.environ['GITHUB_ENV'],'a') as f:
         f.write('EXACT_PYTHON='+r['executable']+'\n')
         f.write('EXACT_HOST='+r['roots']['openpine']+'\n')
         f.write('PYTHONPATH='+r['roots']['openpine']+'\n')
        PYROOT
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: rc6-checks-${{ matrix.python }}-${{ github.run_id }}
        path: |-
          ${{ runner.temp }}/foundation/
          !${{ runner.temp }}/foundation/**/private/**
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: rc6-command-foundation-${{ matrix.python }}-${{ github.run_id }}
        path: ${{ runner.temp }}/restored/execute-log/commands/
        if-no-files-found: error
        retention-days: 7
  frontend:
    needs:
    - prepare
    - plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.13'
    - run: "python -m pip install --require-hashes --only-binary=:all: -r verification/ci-bootstrap-requirements.txt"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rc6-prepared-3.13-${{ github.run_id }}
        path: ${{ runner.temp }}/prepared
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rc6-plan-${{ github.run_id }}
        path: ${{ runner.temp }}/plan
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: openpine-ui/package-lock.json
    - name: Prepare the frozen browser tool without claiming frontend qualification
      working-directory: openpine-ui
      run: |
        npm ci
        npx playwright install --with-deps chromium
    - name: Restore checked source/environment locators
      run: |
        python -m openpine.verification test-ci restore --bundle "$RUNNER_TEMP/prepared" --work "$RUNNER_TEMP/owner-env313" --plan "$RUNNER_TEMP/plan/plan.json"
        python - <<'PYFRONTEND'
        import json,os,pathlib
        from openpine.verification.execution_binding import make_binding
        from openpine.verification.execution_identity import write_once_json
        root=pathlib.Path(os.environ['RUNNER_TEMP']);r=json.loads((root/'owner-env313/restored.json').read_text());plan=json.loads((root/'plan/plan.json').read_text())
        binding=make_binding(plan,{n:pathlib.Path(p) for n,p in r['roots'].items()},{'py313':r['executable']})
        write_once_json(root/'frontend-binding.json',binding)
        with open(os.environ['GITHUB_ENV'],'a') as f:
         f.write('EXACT_PYTHON='+r['executable']+'\n');f.write('EXACT_HOST='+r['roots']['openpine']+'\n');f.write('PYTHONPATH='+r['roots']['openpine']+'\n')
        PYFRONTEND
    - name: Run the complete independently reviewed frontend owner
      env:
        TMPDIR: ${{ runner.temp }}
        OPENPINE_PLAN: ${{ runner.temp }}/plan/plan.json
        OPENPINE_BINDING: ${{ runner.temp }}/frontend-binding.json
        OPENPINE_ATTEMPT_ROOT: ${{ runner.temp }}/exact-owner
      run: '"$EXACT_PYTHON" "$EXACT_HOST/scripts/rc6_stabilization/frontend_exact.py"'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: rc6-ui-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/exact-owner/frontend/
          !${{ runner.temp }}/exact-owner/frontend/**/private/**
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
  packages:
    needs:
    - prepare
    - plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: rc6-prepared-*-${{ github.run_id }}
        path: ${{ runner.temp }}/prepared-lanes
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rc6-plan-${{ github.run_id }}
        path: ${{ runner.temp }}/plan
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.13'
    - run: "python -m pip install --require-hashes --only-binary=:all: -r verification/ci-bootstrap-requirements.txt"
    - run: python -m openpine.verification test-ci restore --bundle "$RUNNER_TEMP/prepared-lanes/rc6-prepared-3.13-${{ github.run_id }}" --work "$RUNNER_TEMP/owner-env313" --plan "$RUNNER_TEMP/plan/plan.json"
    - name: Bind all three real package interpreters and exact source roots
      run: |
        python - <<'PYPACKAGE'
        import json,os,pathlib
        from openpine.verification.execution_binding import make_binding
        from openpine.verification.execution_identity import write_once_json
        root=pathlib.Path(os.environ['RUNNER_TEMP']);plan=json.loads((root/'plan/plan.json').read_text())
        reports={label:json.loads((root/('owner-env'+label[2:])/'restored.json').read_text()) for label in ('py313',)};r=reports['py313']
        binding=make_binding(plan,{n:pathlib.Path(p) for n,p in r['roots'].items()},{label:row['executable'] for label,row in reports.items()})
        write_once_json(root/'package-binding.json',binding)
        write_once_json(root/'package-interpreters.json',{'.'.join(plan['environments'][label]['identity']['python'].split('.')[:2]):row['executable'] for label,row in reports.items()})
        write_once_json(root/'package-source.json',plan['source'])
        with open(os.environ['GITHUB_ENV'],'a') as f:
         f.write('EXACT_PYTHON='+r['executable']+'\n');f.write('EXACT_HOST='+r['roots']['openpine']+'\n');f.write('PYTHONPATH='+r['roots']['openpine']+'\n')
        PYPACKAGE
    - name: Qualify normal and sdist-rebuilt complete stacks on ordinary CPython 3.13
      run: '"$EXACT_PYTHON" "$EXACT_HOST/scripts/rc6_stabilization/harness.py" --roots "$RUNNER_TEMP/plan/plan.json" --binding "$RUNNER_TEMP/package-binding.json" --interpreters "$RUNNER_TEMP/package-interpreters.json" --builder "$EXACT_PYTHON" --output "$RUNNER_TEMP/package-owner" --frozen-source "$RUNNER_TEMP/package-source.json" --run-id "rc6-${{ github.run_id }}-${{ github.run_attempt }}"'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: rc6-packages-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/package-owner/
          !${{ runner.temp }}/package-owner/**/private/**
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
  aggregate:
    name: RC6 native graph (not stabilization or language acceptance)
    if: always()
    needs:
    - prepare
    - plan
    - component
    - quality
    - verify
    - frontend
    - packages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Reject any missing, skipped, failed or cancelled required job
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |-
        python - <<'PYRESULT'
        import json,os,pathlib
        results=json.loads(os.environ['NEEDS_JSON'])
        required={'prepare','plan','component','quality','verify','frontend','packages'}
        failed={name:value['result'] for name,value in results.items() if value['result']!='success'}
        report={'scope':'RC6 native CI graph; not full stabilization or Stage 2 acceptance','jobs':results,'errors':failed,'full_stage_accepted':False}
        pathlib.Path('job-results.json').write_text(json.dumps(report,indent=2))
        if set(results)!=required or failed: raise SystemExit(1)
        PYRESULT
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: rc6-job-results-${{ github.run_id }}
        path: job-results.json
        if-no-files-found: error
        retention-days: 7
  language-diagnostic:
    name: RC6 language-diagnostic (${{ matrix.python }})
    needs:
    - prepare
    - plan
    - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.13'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python }}
    - name: Bootstrap only the planner interface
      run: "python -m pip install --require-hashes --only-binary=:all: -r verification/ci-bootstrap-requirements.txt"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rc6-prepared-${{ matrix.python }}-${{ github.run_id }}
        path: ${{ runner.temp }}/prepared
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rc6-plan-${{ github.run_id }}
        path: ${{ runner.temp }}/plan
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rc6-checks-${{ matrix.python }}-${{ github.run_id }}
        path: ${{ runner.temp }}/foundation
    - name: Restore exact installed tools
      run: |-
        python -m openpine.verification test-ci restore --bundle "${{ runner.temp }}/prepared" --work "${{ runner.temp }}/restored" --plan "${{ runner.temp }}/plan/plan.json"
        python - <<'PYROOT'
        import json, os, pathlib
        r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'restored/restored.json').read_text())
        with open(os.environ['GITHUB_ENV'],'a') as f:
         f.write('EXACT_PYTHON='+r['executable']+'\n')
         f.write('EXACT_HOST='+r['roots']['openpine']+'\n')
         f.write('PYTHONPATH='+r['roots']['openpine']+'\n')
        PYROOT
    - name: Diagnostic report generation (not language acceptance)
      shell: bash
      run: |-
        set -euo pipefail
        export PATH="$(dirname "$EXACT_PYTHON"):$PATH"
        cd "$EXACT_HOST"
        export GITHUB_WORKSPACE="$EXACT_HOST"
        mkdir -p "$RUNNER_TEMP/evidence"
        # Carry the already-attested foundation source pins beside raw owner outputs.
        python - <<'PYOWNER'
        import os,pathlib,sys
        from openpine.verification.execution_ci import retain_builtin_owner_evidence
        root=pathlib.Path(os.environ['RUNNER_TEMP'])
        version='py'+''.join(map(str,sys.version_info[:2]))
        retain_builtin_owner_evidence(
         root/'foundation/merged', root/'foundation/suites', root/'evidence',
         version, pathlib.Path(os.environ['EXACT_HOST'])/'docs/RC6_LIFECYCLE_SOURCES.json',
        )
        PYOWNER
        bash scripts/rc6_builtin_remainder.sh --diagnostic-provisional
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: rc6-language-diagnostic-${{ matrix.python }}-${{ github.run_id }}
        path: ${{ runner.temp }}/evidence/
        if-no-files-found: error
        retention-days: 7
  language-provisional:
    name: RC6 language-provisional (${{ matrix.python }})
    needs:
    - prepare
    - plan
    - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.13'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python }}
    - name: Bootstrap only the planner interface
      run: "python -m pip install --require-hashes --only-binary=:all: -r verification/ci-bootstrap-requirements.txt"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rc6-prepared-${{ matrix.python }}-${{ github.run_id }}
        path: ${{ runner.temp }}/prepared
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rc6-plan-${{ github.run_id }}
        path: ${{ runner.temp }}/plan
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rc6-checks-${{ matrix.python }}-${{ github.run_id }}
        path: ${{ runner.temp }}/foundation
    - name: Restore exact installed tools
      run: |-
        python -m openpine.verification test-ci restore --bundle "${{ runner.temp }}/prepared" --work "${{ runner.temp }}/restored" --plan "${{ runner.temp }}/plan/plan.json"
        python - <<'PYROOT'
        import json, os, pathlib
        r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'restored/restored.json').read_text())
        with open(os.environ['GITHUB_ENV'],'a') as f:
         f.write('EXACT_PYTHON='+r['executable']+'\n')
         f.write('EXACT_HOST='+r['roots']['openpine']+'\n')
         f.write('PYTHONPATH='+r['roots']['openpine']+'\n')
        PYROOT
    - name: Diagnostic provisional language verdict; unresolved RC6 debt stays open
      shell: bash
      run: |-
        set -euo pipefail
        export PATH="$(dirname "$EXACT_PYTHON"):$PATH"
        cd "$EXACT_HOST"
        export GITHUB_WORKSPACE="$EXACT_HOST"
        mkdir -p "$RUNNER_TEMP/evidence"
        # Carry the already-attested foundation source pins beside raw owner outputs.
        python - <<'PYOWNER'
        import os,pathlib,sys
        from openpine.verification.execution_ci import retain_builtin_owner_evidence
        root=pathlib.Path(os.environ['RUNNER_TEMP'])
        version='py'+''.join(map(str,sys.version_info[:2]))
        retain_builtin_owner_evidence(
         root/'foundation/merged', root/'foundation/suites', root/'evidence',
         version, pathlib.Path(os.environ['EXACT_HOST'])/'docs/RC6_LIFECYCLE_SOURCES.json',
        )
        PYOWNER
        # RC6 accepts only registry/provenance-bound UNVERIFIED debt for CI.
        # Owner reports retain ok=false/full_stage2_accepted=false; all other
        # failures still fail via the existing explicit diagnostic policy.
        bash scripts/rc6_builtin_remainder.sh --diagnostic-provisional
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: rc6-language-provisional-${{ matrix.python }}-${{ github.run_id }}
        path: ${{ runner.temp }}/evidence/
        if-no-files-found: error
        retention-days: 7
  stabilization:
    name: RC6 common stabilization (not language acceptance)
    if: always()
    needs:
    - prepare
    - plan
    - verify
    - frontend
    - packages
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.13'
    - name: Bootstrap only the planner interface
      run: "python -m pip install --require-hashes --only-binary=:all: -r verification/ci-bootstrap-requirements.txt"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rc6-prepared-3.13-${{ github.run_id }}
        path: ${{ runner.temp }}/prepared
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rc6-plan-${{ github.run_id }}
        path: ${{ runner.temp }}/plan
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: rc6-checks-*-${{ github.run_id }}
        path: ${{ runner.temp }}/foundations
    # UI upload strips frontend/: restore it beneath the frozen attempt slot.
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rc6-ui-${{ github.run_id }}
        path: ${{ runner.temp }}/exact-owner/frontend
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: rc6-packages-${{ github.run_id }}
        path: ${{ runner.temp }}/package-owner
    - name: Restore exact installed tools
      run: |-
        python -m openpine.verification test-ci restore --bundle "${{ runner.temp }}/prepared" --work "${{ runner.temp }}/restored" --plan "${{ runner.temp }}/plan/plan.json"
        python - <<'PYROOT'
        import json, os, pathlib
        r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'restored/restored.json').read_text())
        with open(os.environ['GITHUB_ENV'],'a') as f:
         f.write('EXACT_PYTHON='+r['executable']+'\n')
         f.write('EXACT_HOST='+r['roots']['openpine']+'\n')
         f.write('PYTHONPATH='+r['roots']['openpine']+'\n')
        PYROOT
    - name: Invoke stabilization and fresh current replay with real native locators
      shell: bash
      run: |-
        set -euo pipefail
        ARGS=()
        for FOUNDATION in "$RUNNER_TEMP"/foundations/*; do ARGS+=(--foundation "$FOUNDATION"); done
        # Explicit same-run owners; performance remains absent and unaccepted.
        "$EXACT_PYTHON" -m openpine.verification test-ci stabilization --restored "$RUNNER_TEMP/restored/restored.json" --plan "$RUNNER_TEMP/plan/plan.json" "${ARGS[@]}" --frontend "$RUNNER_TEMP/exact-owner" --packages "$RUNNER_TEMP/package-owner" --run-id "rc6-${{ github.run_id }}-${{ github.run_attempt }}" --output "$RUNNER_TEMP/common"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: rc6-common-owner-${{ github.run_id }}
        path: |-
          ${{ runner.temp }}/common/
          !${{ runner.temp }}/common/**/private/**
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
