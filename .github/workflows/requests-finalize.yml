name: Verify recovered request integration without publishing RC6
'on':
  push:
    branches: ['ops/rc6-requests-finalize-20260906']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          repository: s7cret/pine2ast
          ref: 8627c94308f4cbd96b2a2ce8ad54e17530c312fd
          path: publisher-source
          sparse-checkout: .github/requests/restore.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: cp publisher-source/.github/requests/restore.py "$RUNNER_TEMP/restore.py"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Restore original source commits and pin published test corrections
        env:
          GIT_AUTHOR_NAME: OpenPine Review
          GIT_AUTHOR_EMAIL: openpine-review@users.noreply.github.com
          GIT_COMMITTER_NAME: OpenPine Review
          GIT_COMMITTER_EMAIL: openpine-review@users.noreply.github.com
          GIT_AUTHOR_DATE: '2026-09-06T02:08:00+03:00'
          GIT_COMMITTER_DATE: '2026-09-06T02:08:00+03:00'
        run: |
          python "$RUNNER_TEMP/restore.py" restore .github/requests/plan.json "$RUNNER_TEMP/evidence"
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path('docs/RC6_LIFECYCLE_SOURCES.json')
          pins = json.loads(path.read_text())
          pins.update(pinelib='10a03a46ffb5f94143c473139e8a2bcf0e593d3b', ast2python='0e956411d7dff8b1a68fba3b5af6e63d371c6781')
          path.write_text(json.dumps(pins, indent=2)+'\n')
          PY
          git add docs/RC6_LIFECYCLE_SOURCES.json
          git commit -m 'chore(OP-08): pin published request-aware compiler and runtime checks'
          git update-ref refs/heads/recovered-requests HEAD
          git bundle create "$RUNNER_TEMP/evidence/openpine.bundle" refs/heads/recovered-requests
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/code-head.txt"
      - name: Install clean exact sources and retain complete restoration history
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0 hatchling==1.32.0 build==1.6.0
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'stack'; root.mkdir()
          evidence=root.parent/'evidence'; copies=root.parent/'install-sources'; copies.mkdir()
          pins=json.loads(pathlib.Path('docs/RC6_LIFECYCLE_SOURCES.json').read_text())
          required={'openpine-contracts','pine2ast','ast2python','pinelib','backtest_engine','marketdata-provider','optimizer'}
          if set(pins)!=required or not all(re.fullmatch('[0-9a-f]{40}',v) for v in pins.values()):
              raise SystemExit('Invalid source identities')
          paths=[]
          for name,sha in pins.items():
              path=root/name
              subprocess.run(['git','clone','--quiet','https://github.com/s7cret/'+name+'.git',str(path)],check=True)
              subprocess.run(['git','-C',str(path),'checkout','--detach',sha],check=True)
              if subprocess.check_output(['git','-C',str(path),'rev-parse','HEAD'],text=True).strip()!=sha:
                  raise SystemExit('Source identity mismatch')
              subprocess.run(['git','-C',str(path),'update-ref','refs/heads/exact-source',sha],check=True)
              subprocess.run(['git','-C',str(path),'bundle','create',str(evidence/(name+'.bundle')),'refs/heads/exact-source'],check=True)
              clean=copies/name; clean.mkdir()
              subprocess.run(['tar','-x','-C',str(clean)],input=subprocess.check_output(['git','-C',str(path),'archive',sha]),check=True)
              paths.append(str(clean)+('[parquet,stream,zstd]' if name=='marketdata-provider' else ''))
          subprocess.run(['python','-m','pip','install',*paths,'.[dev]'],check=True)
          (evidence/'source-pins.json').write_text(json.dumps(pins,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('PINE_STACK_ROOT='+str(root)+'\n')
          PY
      - name: Complete library functional suites and offline provider
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          for repo in openpine-contracts pinelib pine2ast ast2python backtest_engine; do
            (cd "$PINE_STACK_ROOT/$repo" && python -m pytest -q --junitxml="$RUNNER_TEMP/evidence/$repo.xml")
          done
          (cd "$PINE_STACK_ROOT/marketdata-provider" && python -m pytest -q -m 'not live_network' --junitxml="$RUNNER_TEMP/evidence/marketdata-provider.xml")
      - name: Enable real protected workers
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y apparmor-profiles apparmor-utils bubblewrap
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          if ! getent passwd openpine-worker >/dev/null; then sudo useradd --system --no-create-home --shell /usr/sbin/nologin openpine-worker; fi
          sudo -n -u openpine-worker -- /usr/bin/id -u
          /usr/bin/bwrap --ro-bind / / --unshare-net -- /usr/bin/true
      - name: Native request checkpoints protected workers and selected regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          selected=json.loads(pathlib.Path('rc6_tests/selected_regressions.json').read_text())
          if len(set(selected))!=len(selected) or any(not p.startswith('tests/test_') or not p.endswith('.py') or not pathlib.Path(p).is_file() for p in selected):
              raise SystemExit('Invalid regression inventory')
          subprocess.run(['python','-m','pytest','-p','pytest_asyncio.plugin','-q','rc6_tests',*sorted(selected),'--junitxml='+os.environ['RUNNER_TEMP']+'/evidence/openpine.xml'],check=True)
          PY
      - name: Lint builds and backend API evidence
        run: |
          python -m ruff check openpine/runtime/request_data.py openpine/runtime/generated_checkpoint.py openpine/runtime/rc6_worker_runtime.py openpine/runtime/rc6_config.py openpine/runtime/isolated_worker.py rc6_tests/test_rc6_requests.py rc6_tests/test_rc6_generated_checkpoint.py
          python -m compileall -q openpine
          python scripts/export_openapi.py "$RUNNER_TEMP/evidence/openapi.json"
          mkdir -p "$RUNNER_TEMP/build-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/build-source"
          python -m build --no-isolation --outdir "$RUNNER_TEMP/evidence/dist" "$RUNNER_TEMP/build-source"
          python -m pip freeze > "$RUNNER_TEMP/evidence/environment.txt"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-requests-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 30
          if-no-files-found: error
