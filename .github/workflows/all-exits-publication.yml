name: Verify integrated all-entry exits before RC6 publication
'on':
  push:
    branches: ['ops/rc6-all-exits-20260906']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: rc6-all-exits-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8b933622eacdd33b78fe1f45b413c0d736a54b78
          fetch-depth: 0
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = 8b933622eacdd33b78fe1f45b413c0d736a54b78
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install clean exact sibling sources
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0 hatchling==1.32.0 build==1.6.0
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'stack'
          root.mkdir()
          evidence=root.parent/'evidence'
          evidence.mkdir()
          builds=root.parent/'install-sources'
          builds.mkdir()
          pins=json.loads(pathlib.Path('docs/RC6_LIFECYCLE_SOURCES.json').read_text())
          expected={'openpine-contracts','pinelib','pine2ast','ast2python','backtest_engine','optimizer','marketdata-provider'}
          if set(pins)!=expected or not all(re.fullmatch('[0-9a-f]{40}',s) for s in pins.values()):
              raise SystemExit('Invalid source identity set')
          sources=[]
          for name,sha in pins.items():
              path=root/name
              subprocess.run(['git','clone','--quiet','https://github.com/s7cret/'+name+'.git',str(path)],check=True)
              subprocess.run(['git','-C',str(path),'checkout','--detach',sha],check=True)
              if subprocess.check_output(['git','-C',str(path),'rev-parse','HEAD'],text=True).strip()!=sha:
                  raise SystemExit('Dependency checkout identity mismatch')
              clean=builds/name
              clean.mkdir()
              subprocess.run(['tar','-x','-C',str(clean)],input=subprocess.check_output(['git','-C',str(path),'archive',sha]),check=True)
              sources.append(str(clean)+('[parquet,stream,zstd]' if name=='marketdata-provider' else '[dev]' if name=='optimizer' else ''))
          subprocess.run(['python','-m','pip','install',*sources,'.[dev]'],check=True)
          (evidence/'source-pins.json').write_text(json.dumps(pins,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PINE_STACK_ROOT='+str(root)+'\n')
          PY
      - name: Six complete library functional suites
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          for repo in openpine-contracts pinelib pine2ast ast2python backtest_engine optimizer; do
            (cd "$PINE_STACK_ROOT/$repo" && python -m pytest -q --junitxml="$RUNNER_TEMP/evidence/$repo.xml")
          done
      - name: Deterministic provider suite with offline extras
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          cd "$PINE_STACK_ROOT/marketdata-provider"
          python -m pytest -q -m 'not live_network' --junitxml="$RUNNER_TEMP/evidence/marketdata-provider.xml"
      - name: Enable the protected real-worker environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y apparmor-profiles apparmor-utils bubblewrap
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          if ! getent passwd openpine-worker >/dev/null; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin openpine-worker
          fi
          sudo -n -u openpine-worker -- /usr/bin/id -u
          /usr/bin/bwrap --ro-bind / / --unshare-net -- /usr/bin/true
      - name: Complete native RC6 and explicit affected-path regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess
          evidence=pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence'
          paths=json.loads(pathlib.Path('rc6_tests/selected_regressions.json').read_text())
          if not isinstance(paths,list) or len(set(paths))!=len(paths) or any(not isinstance(p,str) or not p.startswith('tests/test_') or not p.endswith('.py') or not pathlib.Path(p).is_file() for p in paths):
              raise SystemExit('Invalid explicit regression selection')
          (evidence/'selected-tests.json').write_text(json.dumps(sorted(paths),indent=2)+'\n')
          subprocess.run(['python','-m','pytest','-p','pytest_asyncio.plugin','-q','rc6_tests',*sorted(paths),'--junitxml='+str(evidence/'openpine.xml')],check=True)
          PY
      - name: Retained lint gate and actual backend build
        run: |
          python -m ruff check openpine/runtime/bulk_result.py openpine/runtime/bulk_worker.py openpine/runtime/progress.py openpine/runtime/engine.py openpine/runtime/isolated_run.py openpine/runtime/isolated_worker.py openpine/runtime/rc6_worker_runtime.py openpine/storage/parquet.py openpine/runtime/request_data.py openpine/runtime/request_requirements.py openpine/runtime/generated_checkpoint.py openpine/runtime/worker_capabilities.py rc6_tests/test_rc6_requests.py rc6_tests/test_rc6_generated_checkpoint.py rc6_tests/test_rc6_checkpoint_receipts.py rc6_tests/test_rc6_request_preflight.py rc6_tests/test_rc6_request_causality.py rc6_tests/test_rc6_worker_capabilities.py openpine/runtime/request_transport.py rc6_tests/test_rc6_nested_integration.py rc6_tests/test_rc6_request_transport.py openpine/optimizer/isolated_runner.py rc6_tests/test_rc6_optimizer_requests.py rc6_tests/test_rc6_review_ledger.py openpine/runtime/rc6_config.py openpine/runtime/strategy_host.py rc6_tests/test_rc6_deferred_exits.py rc6_tests/test_rc6_mintick_binding.py rc6_tests/test_rc6_price_entry_exits.py rc6_tests/test_rc6_all_entry_exits.py rc6_tests/test_rc6_all_entry_literal_ids.py rc6_tests/test_rc6_strategy_surface.py
          python -m compileall -q openpine
          python scripts/export_openapi.py "$RUNNER_TEMP/evidence/openapi.json"
          mkdir -p "$RUNNER_TEMP/build-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/build-source"
          python -m build --no-isolation --outdir "$RUNNER_TEMP/evidence/dist" "$RUNNER_TEMP/build-source"
          python -m pip freeze > "$RUNNER_TEMP/evidence/environment.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/code-head.txt"
          git update-ref refs/heads/review-candidate HEAD
          git bundle create "$RUNNER_TEMP/evidence/verified.bundle" refs/heads/review-candidate
          git bundle verify "$RUNNER_TEMP/evidence/verified.bundle"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-exits-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30
  frontend:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: openpine-ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8b933622eacdd33b78fe1f45b413c0d736a54b78
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: all-exits-3.13-${{ github.run_id }}
          path: ${{ runner.temp }}/backend-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: openpine-ui/package-lock.json
      - run: npm ci
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/ui-tests.xml"
      - run: npm run build | tee "$RUNNER_TEMP/ui-build.log"
      - run: npm run test:node | tee "$RUNNER_TEMP/ui-node.log"
        env:
          OPENPINE_OPENAPI_SCHEMA: ${{ runner.temp }}/backend-evidence/openapi.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-exits-ui-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ui-tests.xml
            ${{ runner.temp }}/ui-build.log
            ${{ runner.temp }}/ui-node.log
            openpine-ui/dist/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: [verify,frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: all-exits-3.13-${{ github.run_id }}
          path: evidence
      - name: Guarded fast-forward and atomic archival of this temporary branch
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess
          head='8b933622eacdd33b78fe1f45b413c0d736a54b78'
          base='84657611816c540d9f447364f320134aa5f016e9'
          target='refs/heads/release/5.0.0rc6'
          branch='refs/heads/ops/rc6-all-exits-20260906'
          tag='refs/tags/ops/rc6-all-exits-20260906'
          evidence=pathlib.Path('evidence')
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def refs(): return {r:s for s,r in (line.split() for line in git('ls-remote','--refs','origin').splitlines())}
          if os.environ['GITHUB_REPOSITORY']!='s7cret/openpine' or os.environ['GITHUB_REF']!=branch:
              raise SystemExit('Unexpected publication identity')
          if (evidence/'code-head.txt').read_text().strip()!=head:
              raise SystemExit('Verification receipt differs from candidate')
          git('fetch',str((evidence/'verified.bundle').resolve()),'refs/heads/review-candidate')
          if git('rev-parse','FETCH_HEAD')!=head: raise SystemExit('Bundle identity mismatch')
          git('merge-base','--is-ancestor',base,head)
          before=refs()
          if before.get(target) not in (base,head): raise SystemExit('Concurrent release change')
          if before[target]!=head: git('push','origin',head+':'+target)
          if refs().get(target)!=head: raise SystemExit('Publication verification failed')
          sha=os.environ['GITHUB_SHA']
          git('push','--atomic',f'--force-with-lease={branch}:{sha}',f'--force-with-lease={tag}:','origin',sha+':'+tag,':'+branch)
          after=refs()
          expected={k:v for k,v in before.items() if k.startswith('refs/heads/') and k!=branch}
          expected[target]=head
          if {k:v for k,v in after.items() if k.startswith('refs/heads/')}!=expected or after.get(tag)!=sha:
              raise SystemExit('Branch or archive preservation mismatch')
          for name,value in [('before',before),('after',after)]:
              (evidence/(name+'.json')).write_text(json.dumps(value,indent=2)+'\n')
          (evidence/'published-head.txt').write_text(head+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-exits-publication-${{ github.run_id }}
          path: evidence/
          retention-days: 30
