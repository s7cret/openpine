name: R6 gate

on:
  push:
    branches: [r6-rebuild]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m tools.release_gate --fast --timings .runtime/feedback-timings

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m tools.ci_artifacts build --directory .runtime/ci-wheel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r6-wheel
          path: .runtime/ci-wheel/*
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r6-receipt-build
          path: .runtime/ci-wheel/manifest.json
          include-hidden-files: true
          if-no-files-found: error

  qualification:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: r6-wheel
          path: .runtime/ci-wheel
      - run: python -m tools.ci_artifacts verify-wheel --directory .runtime/ci-wheel
      - run: python -m tools.release_gate --section specification --timings .runtime/specification
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: r6-receipt-spec-${{ matrix.os }}
          path: .runtime/specification/**
          include-hidden-files: true
          if-no-files-found: error

  tests:
    needs: qualification
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: r6-receipt-spec-${{ matrix.os }}
          path: .runtime/specification
      - run: python -m tools.release_gate --section tests --qualification .runtime/specification/gate.json --shard-count 6 --shard-index ${{ matrix.shard }} --timings .runtime/gate-timings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: r6-receipt-tests-${{ matrix.os }}-gate-${{ matrix.shard }}
          path: .runtime/gate-timings/*.json
          include-hidden-files: true
          if-no-files-found: error

  installation:
    needs: qualification
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [core, lots, oca, exits, signals, trailing, windows, targets, economics, research, performance, risk, numeric, contexts, observed, cycle, intrabar, magnifier]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: r6-wheel
          path: .runtime/ci-wheel
      - run: python -m tools.install_check --wheel-dir .runtime/ci-wheel --suite ${{ matrix.suite }} --receipt .runtime/installed.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: r6-receipt-installed-${{ matrix.os }}-${{ matrix.suite }}
          path: .runtime/installed.json
          include-hidden-files: true
          if-no-files-found: error

  acceptance:
    needs: [feedback, build, qualification, tests, installation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: r6-receipt-*
          path: .runtime/receipts
          merge-multiple: false
      - run: python -m tools.ci_artifacts accept --receipts .runtime/receipts --output .runtime/acceptance.json
      - name: Long managed worker and coordinator recovery
        run: python -m tools.managed_recovery_soak --directory .runtime/recovery/managed --bars 100000
      - name: Long realtime rollback and memory plateau
        run: python -m tools.realtime_memory_soak --directory .runtime/recovery/realtime --bars 256 --updates 64
      - name: Million-event persisted value oracle
        run: python -m tools.unified_storage_soak --directory .runtime/recovery/unified --bars 333334
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: r6-acceptance
          path: |
            .runtime/acceptance.json
            .runtime/recovery/**/report.json
            .runtime/recovery/realtime/v*.json
          include-hidden-files: true
          if-no-files-found: error
