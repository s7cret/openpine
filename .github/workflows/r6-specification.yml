name: R6 gate

on:
  push:
    branches: [r6-rebuild]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Fast development feedback (full qualification follows)
        run: python -m tools.release_gate --fast --timings .runtime/feedback-timings
  specification:
    needs: feedback
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        check: [gate-0, gate-1, gate-2]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install specification validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify specification, execution and conformance
        if: startsWith(matrix.check, 'gate-')
        run: python -m tools.release_gate --shard-count 3 --shard-index ${{ matrix.check == 'gate-0' && '0' || matrix.check == 'gate-1' && '1' || '2' }} --timings .runtime/gate-timings
  installation:
    needs: feedback
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [core, research, numeric, contexts, exits, lots, oca, trailing, economics, risk, performance]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install specification validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify installed suite outside checkout
        run: python -m tools.install_check --suite ${{ matrix.suite }}
