name: R6 gate

on:
  push:
    branches: [r6-rebuild]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install specification validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify specification, first execution slice and conformance
        run: python -m tools.release_gate
