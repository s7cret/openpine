name: Archive completed integration repair transport
'on':
  push:
    branches: ['ops/cumulative-integration-fix-20260912']
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve helper history and remove only its finished branch
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def refs():
              return {ref:sha for sha,ref in (line.split() for line in git('ls-remote','--refs','origin').splitlines())}
          def require(ok, message):
              if not ok:
                  raise SystemExit(message)
          branch='refs/heads/ops/cumulative-integration-fix-20260912'
          archive='refs/tags/archive/20260912/ops/cumulative-integration-fix'
          source='da413b1a9f6c8f62de590adfad94db5254f357c9'
          current=os.environ['GITHUB_SHA']
          require(os.environ['GITHUB_REPOSITORY']=='s7cret/openpine' and os.environ['GITHUB_REF']==branch,'wrong repository/ref')
          require(git('rev-parse',current+'^')=='586ccee4b60b72cb8e83cb7d0f402c1be70f55a0','unexpected maintenance parent')
          before=refs()
          require(before.get(branch)==current and archive not in before,'concurrent helper update')
          require(before.get('refs/tags/integration/cumulative-ci-assertions-20260912')==source,'source fix is not preserved')
          candidate=before.get('refs/heads/stage2/cumulative-local-20260912')
          require(bool(candidate),'candidate missing')
          git('merge-base','--is-ancestor',source,candidate)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'cleanup';out.mkdir()
          (out/'before.json').write_text(json.dumps(before,indent=2)+'\n')
          git('push','--atomic','--force-with-lease='+branch+':'+current,'--force-with-lease='+archive+':','origin',current+':'+archive,':'+branch)
          after=refs();expected={k:v for k,v in before.items() if k!=branch};expected[archive]=current
          (out/'after.json').write_text(json.dumps(after,indent=2)+'\n')
          require(after==expected,'unrelated refs changed; inspect snapshots')
          print(json.dumps({'archived':archive,'removed':branch,'candidate':candidate,'release_unchanged':True,'merge_performed':False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-helper-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/cleanup/
          if-no-files-found: error
          retention-days: 30
