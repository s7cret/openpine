name: OpenPine CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PINE_STACK_ROOT: ${{ github.workspace }}/stack
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Pine2AST
        uses: actions/checkout@v4
        with:
          repository: s7cret/pine2ast
          ref: c57323351a1e638e0337e1be247883da2570ab28
          path: stack/pine2ast
      - name: Checkout AST2Python
        uses: actions/checkout@v4
        with:
          repository: s7cret/ast2python
          ref: e95fa8a3746caf641c847a38ead551e9d5f67c3f
          path: stack/ast2python
      - name: Checkout PineLib
        uses: actions/checkout@v4
        with:
          repository: s7cret/pinelib
          ref: e42ccf881fbafb2c06311bcf8ba8435d055afea4
          path: stack/pinelib
      - name: Checkout Backtest Engine
        uses: actions/checkout@v4
        with:
          repository: s7cret/backtest_engine
          ref: b1457ee8757047a8bdf39f718cd2f4b8590c7323
          path: stack/backtest_engine
      - name: Checkout Marketdata Provider
        uses: actions/checkout@v4
        with:
          repository: s7cret/marketdata-provider
          ref: c943348f88f8af52b11a2c9fbcaca1b8e1d7e244
          path: stack/marketdata-provider
      - name: Checkout Optimizer
        uses: actions/checkout@v4
        with:
          repository: s7cret/optimizer
          ref: 73d67934d078cb97a4947cc7b0b12665c4086099
          path: stack/optimizer
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: bash scripts/release_gate.sh
      - name: Type-check hardened API boundary
        run: >-
          python -m mypy --python-version 3.13 --ignore-missing-imports
          --follow-imports=skip --disable-error-code=unused-ignore
          openpine/gateway/security.py openpine/gateway/config.py
          openpine/gateway/server.py openpine/gateway/deps.py
          openpine/gateway/schemas.py openpine/gateway/routes/backtest.py
          openpine/gateway/routes/orders_positions.py
          openpine/storage/backtest_storage.py
      - name: Export API contract
        run: python scripts/export_openapi.py openpine-ui/.contract/openapi.json
      - name: Upload API contract
        uses: actions/upload-artifact@v4
        with:
          name: openpine-openapi-${{ matrix.python-version }}
          path: openpine-ui/.contract/openapi.json
          if-no-files-found: error

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openpine-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: openpine-ui/package-lock.json
      - name: Install exact npm toolchain
        run: npm install --global npm@11.16.0
      - name: Verify npm toolchain
        run: test "$(npm --version)" = "11.16.0"
      - uses: actions/download-artifact@v4
        with:
          name: openpine-openapi-3.13
          path: openpine-ui/.contract
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run test:node
        env:
          OPENPINE_OPENAPI_SCHEMA: .contract/openapi.json
      - name: Install Chromium for E2E and accessibility gates
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
