name: OpenPine CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PINE_STACK_ROOT: ${{ github.workspace }}/stack
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install candidate build tooling
        run: python -m pip install --upgrade build
      - name: Install Bubblewrap sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y apparmor-profiles apparmor-utils bubblewrap
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          if ! getent passwd openpine-worker >/dev/null; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin openpine-worker
          fi
          sudo -n -u openpine-worker -- /usr/bin/id -u
          /usr/bin/bwrap --ro-bind / / --unshare-net -- /usr/bin/true
      - name: Materialize immutable stack candidate
        run: |
          mkdir -p "$RUNNER_TEMP/openpine-candidate"
          python scripts/materialize_stack_candidate.py \
            --template candidates/stack-candidate-5.0.0-rc.4.template.json \
            --openpine-sha "$GITHUB_SHA" \
            --created-at-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --builder github-actions \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --source-uri "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/openpine-candidate/stack-candidate-5.0.0-rc.4.json"
      - name: Resolve active stack candidate
        id: stack
        run: >-
          python scripts/resolve_stack_candidate.py
          --root "$RUNNER_TEMP/openpine-candidate"
          --github-output "$GITHUB_OUTPUT"
      - name: Checkout OpenPine Contracts candidate
        if: ${{ steps.stack.outputs.mode == 'candidate' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.stack.outputs.openpine_contracts_repo }}
          ref: ${{ steps.stack.outputs.openpine_contracts_sha }}
          path: stack/openpine-contracts
          fetch-depth: 0
      - name: Checkout Pine2AST
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.stack.outputs.pine2ast_repo || 's7cret/pine2ast' }}
          ref: ${{ steps.stack.outputs.pine2ast_sha || '1715eef9c395b81db24224b6724f16589c1c960a' }}
          path: stack/pine2ast
          fetch-depth: 0
      - name: Checkout AST2Python
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.stack.outputs.ast2python_repo || 's7cret/ast2python' }}
          ref: ${{ steps.stack.outputs.ast2python_sha || 'ce8a691c6bdc8a1a1c81a2b8ed2cebb36e02da3b' }}
          path: stack/ast2python
          fetch-depth: 0
      - name: Checkout PineLib
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.stack.outputs.pinelib_repo || 's7cret/pinelib' }}
          ref: ${{ steps.stack.outputs.pinelib_sha || '6e649cb81a2d0d971dd7df66c542e22e19e39319' }}
          path: stack/pinelib
          fetch-depth: 0
      - name: Checkout Backtest Engine
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.stack.outputs.backtest_engine_repo || 's7cret/backtest_engine' }}
          ref: ${{ steps.stack.outputs.backtest_engine_sha || '3ccb3b32779cd633bcf3bde125dd586c3367f792' }}
          path: stack/backtest_engine
          fetch-depth: 0
      - name: Checkout Marketdata Provider
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.stack.outputs.marketdata_provider_repo || 's7cret/marketdata-provider' }}
          ref: ${{ steps.stack.outputs.marketdata_provider_sha || 'e098947dfd30444273090e521e5c749673909c37' }}
          path: stack/marketdata-provider
          fetch-depth: 0
      - name: Checkout Optimizer
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.stack.outputs.optimizer_repo || 's7cret/optimizer' }}
          ref: ${{ steps.stack.outputs.optimizer_sha || '1a6e8857d18ec072309bdf6d4832f56a6c3de6e4' }}
          path: stack/optimizer
          fetch-depth: 0
      - name: Exclude candidate checkouts from OpenPine source status
        run: printf 'stack/\n' >> .git/info/exclude
      - name: Verify candidate checkout identities
        if: ${{ steps.stack.outputs.mode == 'candidate' }}
        run: |
          python scripts/build_candidate_wheelhouse.py \
            --candidate "$RUNNER_TEMP/openpine-candidate/${{ steps.stack.outputs.candidate_path }}" \
            --outdir "$RUNNER_TEMP/openpine-candidate-verification" \
            --checkout openpine-contracts=stack/openpine-contracts \
            --checkout marketdata-provider=stack/marketdata-provider \
            --checkout pinelib=stack/pinelib \
            --checkout backtest_engine=stack/backtest_engine \
            --checkout pine2ast=stack/pine2ast \
            --checkout ast2python=stack/ast2python \
            --checkout optimizer=stack/optimizer \
            --checkout openpine=. \
            --build
      - name: Finalize and clean-install wheel-bound candidate
        run: |
          python scripts/finalize_stack_candidate.py \
            --candidate "$RUNNER_TEMP/openpine-candidate/${{ steps.stack.outputs.candidate_path }}" \
            --wheelhouse "$RUNNER_TEMP/openpine-candidate-verification" \
            --output "$RUNNER_TEMP/openpine-candidate/stack-candidate-5.0.0-rc.4.wheels.json"
          rm -f "$RUNNER_TEMP/openpine-candidate/${{ steps.stack.outputs.candidate_path }}"
          python -m venv "$RUNNER_TEMP/openpine-candidate-venv"
          "$RUNNER_TEMP/openpine-candidate-venv/bin/python" -m pip install -U pip
          "$RUNNER_TEMP/openpine-candidate-venv/bin/python" \
            scripts/install_candidate_wheelhouse.py \
            --candidate "$RUNNER_TEMP/openpine-candidate/stack-candidate-5.0.0-rc.4.wheels.json" \
            --wheelhouse "$RUNNER_TEMP/openpine-candidate-verification" \
            --python "$RUNNER_TEMP/openpine-candidate-venv/bin/python" \
            --install
          "$RUNNER_TEMP/openpine-candidate-venv/bin/python" -m pip install \
            'pytest>=8.0.0' 'pytest-cov>=4.0.0' 'ruff>=0.4.0' \
            'mypy>=1.10.0' 'httpx>=0.28.0' 'pytest-asyncio>=1.4.0' \
            'matplotlib>=3.8.0' 'build>=1.2.0'
          echo "$RUNNER_TEMP/openpine-candidate-venv/bin" >> "$GITHUB_PATH"
      - name: Run candidate release gate
        env:
          OPENPINE_BUILD_COMMIT: ${{ github.sha }}
          OPENPINE_PRODUCER_COMMITS_JSON: >-
            {"pine2ast":"1715eef9c395b81db24224b6724f16589c1c960a","ast2python":"ce8a691c6bdc8a1a1c81a2b8ed2cebb36e02da3b","pinelib":"6e649cb81a2d0d971dd7df66c542e22e19e39319","openpine-contracts":"a91c0ce0d36d60e8dc5cb43e7aa92ab59c2eaa6c"}
        run: >-
          OPENPINE_CANDIDATE_MANIFEST="$RUNNER_TEMP/openpine-candidate/stack-candidate-5.0.0-rc.4.wheels.json"
          bash scripts/release_gate.sh
      - name: Type-check hardened API boundary
        run: >-
          python -m mypy --python-version 3.13 --ignore-missing-imports
          --follow-imports=skip --disable-error-code=unused-ignore
          openpine/gateway/security.py openpine/gateway/config.py
          openpine/gateway/server.py openpine/gateway/deps.py
          openpine/gateway/schemas.py openpine/gateway/routes/backtest.py
          openpine/gateway/routes/orders_positions.py
          openpine/storage/backtest_storage.py
      - name: Export API contract
        run: python scripts/export_openapi.py openpine-ui/.contract/openapi.json
      - name: Upload API contract
        uses: actions/upload-artifact@v4
        with:
          name: openpine-openapi-${{ matrix.python-version }}
          path: openpine-ui/.contract/openapi.json
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    # Independent of backend: a backend fail must not skip UI checks.
    defaults:
      run:
        working-directory: openpine-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: openpine-ui/package-lock.json
      - name: Install exact npm toolchain
        run: npm install --global npm@11.16.0
      - name: Verify npm toolchain
        run: test "$(npm --version)" = "11.16.0"
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
      - name: Install Chromium for E2E and accessibility gates
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high

  openapi-drift:
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openpine-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: openpine-ui/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: openpine-openapi-3.13
          path: openpine-ui/.contract
      - run: test -s .contract/openapi.json
      - run: python ../scripts/generate_openapi_ts.py .contract/openapi.json .contract/openapi.ts
      - name: Verify generated OpenAPI client is current
        run: python -c "from pathlib import Path; assert Path('.contract/openapi.ts').read_bytes() == Path('src/api/generated/openapi.ts').read_bytes(), 'generated OpenAPI client drift'"
      - run: npm ci
      - run: npm run build
      - run: npm run test:node
        env:
          OPENPINE_OPENAPI_SCHEMA: .contract/openapi.json

  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openpine-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: openpine-ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
