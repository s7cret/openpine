name: RC6 saved candidate review and guarded old-branch cleanup
'on':
  push:
    branches: ['codex/recursive-method-contracts-20260908']
    paths: ['scripts/review_saved_candidate.py', '.github/workflows/rc6-saved-candidate-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc6-saved-candidate-review
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact obsolete heads and delete only those two branches
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          def git(*a): return subprocess.check_output(['git', *a], text=True).strip()
          def refs(): return {ref:sha for sha,ref in (x.split() for x in git('ls-remote','--refs','origin').splitlines())}
          plan={'stage2/language-completion-20260907':'648083aed1b11cba805e0c49095b797bac016327','stage2/nominal-ci-20260907':'ff813837858d360480d0e46b8ab3f0d90ecfa6e0'}
          before=refs(); base='4a84ff2873caef95d8eb986dc1e999c379f33fbf'
          if before.get('refs/heads/release/5.0.0rc6')!=base: raise SystemExit('release changed; stop cleanup')
          git('merge-base','--is-ancestor',plan['stage2/language-completion-20260907'],base)
          old=plan['stage2/nominal-ci-20260907']; common=git('merge-base',base,old)
          if git('diff','--name-only',common,old).splitlines()!=['.github/workflows/nominal-ci.yml']: raise SystemExit('unexpected unique nominal source')
          updates=[]; leases=[]; expected=dict(before)
          for name,sha in plan.items():
              branch='refs/heads/'+name; tag='refs/tags/archive/20260911/'+name
              if before.get(branch) not in (None,sha) or before.get(tag) not in (None,sha): raise SystemExit('branch/tag changed; stop cleanup')
              if tag not in before:
                  updates.append(sha+':'+tag); leases.append('--force-with-lease='+tag+':'); expected[tag]=sha
              if branch in before:
                  updates.append(':'+branch); leases.append('--force-with-lease='+branch+':'+sha); expected.pop(branch)
          if updates: git('push','--atomic',*leases,'origin',*updates)
          after=refs()
          if after!=expected: raise SystemExit('unexpected final refs')
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'cleanup';out.mkdir()
          for name,value in [('before',before),('after',after),('plan',plan)]: (out/(name+'.json')).write_text(json.dumps(value,indent=2)+'\n')
          print(json.dumps({'archived':plan,'remaining_branches':{k:v for k,v in after.items() if k.startswith('refs/heads/')}},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-branch-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/cleanup/
          if-no-files-found: warn
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare the same protected Linux worker environment as RC6
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y apparmor-profiles apparmor-utils bubblewrap
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          if ! getent passwd openpine-worker >/dev/null; then sudo useradd --system --no-create-home --shell /usr/sbin/nologin openpine-worker; fi
          sudo -n -u openpine-worker -- /usr/bin/id -u
          /usr/bin/bwrap --ro-bind / / --unshare-net -- /usr/bin/true
          python -m pip install setuptools==84.0.0 wheel==0.48.0 hatchling==1.32.0 build==1.6.0
      - name: Collect exact baseline and candidate, retain all failures, run protected tests
        run: python scripts/review_saved_candidate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-saved-review-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-review/
          if-no-files-found: error
          retention-days: 30
  frontend:
    needs: review
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8aa6a3e4f6f172652daf3ba37aade9f21e122c6c
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rc6-saved-review-3.13-${{ github.run_id }}
          path: ${{ runner.temp }}/backend
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: openpine-ui/package-lock.json
      - run: npm ci
        working-directory: openpine-ui
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/ui-tests.xml"
        working-directory: openpine-ui
      - run: npm run build
        working-directory: openpine-ui
      - run: npm run test:node | tee "$RUNNER_TEMP/ui-node.log"
        shell: bash
        working-directory: openpine-ui
        env:
          OPENPINE_OPENAPI_SCHEMA: ${{ runner.temp }}/backend/openapi.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-saved-frontend-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ui-tests.xml
            ${{ runner.temp }}/ui-node.log
            openpine-ui/dist/
          retention-days: 30
