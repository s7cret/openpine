name: Finalize reviewed saved-wave inventory and exact-source acceptance
'on':
  push:
    branches: ['codex/recursive-method-contracts-20260908']
    paths: ['.github/rc6-finalize/**', '.github/workflows/rc6-saved-final-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34594834647
          name: rc6-saved-review-3.11-34594834647
          path: ${{ runner.temp }}/root-3.11
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34594834647
          name: rc6-saved-review-3.13-34594834647
          path: ${{ runner.temp }}/root-3.13
      - name: Bind only reviewed metadata, replay the unchanged aggregate, check exact source
        env:
          REVIEW_PYTHON: ${{ matrix.python }}
        run: |
          cp -r .github/rc6-finalize "$RUNNER_TEMP/draft"
          python -m pip install setuptools==84.0.0 wheel==0.48.0 hatchling==1.32.0 build==1.6.0
          python "$RUNNER_TEMP/draft/finalize.py"
          cp -r "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/final-gate/build-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-wave-final-gate-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/final-gate/
          if-no-files-found: error
          retention-days: 30
  publish_candidate:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: saved-wave-final-gate-3.13-${{ github.run_id }}
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: saved-wave-final-gate-3.11-${{ github.run_id }}
          path: counterpart
      - name: Publish the reviewed candidate only; never update release automatically
        shell: bash
        run: |
          set -euo pipefail
          cmp evidence/prepared-head.txt counterpart/prepared-head.txt
          cmp evidence/prepared-tree.txt counterpart/prepared-tree.txt
          git fetch evidence/verified.bundle refs/heads/validated-saved-wave
          head=$(cat evidence/prepared-head.txt)
          test "$(git rev-parse FETCH_HEAD)" = "$head"
          test "$(git ls-remote origin refs/heads/codex/recursive-method-contracts-20260908 | cut -f1)" = '${{ github.sha }}'
          git push origin "$head:refs/heads/codex/recursive-method-contracts-20260908"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-wave-candidate-publication-${{ github.run_id }}
          path: evidence/
          retention-days: 30
