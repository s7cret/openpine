name: Verify and publish reviewed RC6 stack
on:
  push:
    branches: ['ops/rc6-delivery-*']
    paths: ['.github/maintenance/reviewed-series.json']
permissions:
  contents: read
concurrency:
  group: reviewed-rc6-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          repository: s7cret/pinelib
          ref: 931252f637c86b3ffe872ceb4a4cda4453eb7da2
          path: publisher-source
          sparse-checkout: .github/maintenance/reviewed-publisher.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: cp publisher-source/.github/maintenance/reviewed-publisher.py "$RUNNER_TEMP/reviewed-publisher.py"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Reconstruct exact reviewed source commits
        run: |
          python .github/maintenance/extend-reviewed-series.py .github/maintenance/reviewed-series.json "$RUNNER_TEMP/combined-series.json"
          python "$RUNNER_TEMP/reviewed-publisher.py" reconstruct "$RUNNER_TEMP/review-evidence" "$RUNNER_TEMP/combined-series.json"
      - name: Install the exact sibling source set
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install setuptools==84.0.0 wheel==0.48.0 hatchling==1.32.0 build==1.6.0
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review-evidence'
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review-stack'
          root.mkdir()
          pins = json.loads((evidence / 'submission.json').read_text())['stack_sources']
          required = {'openpine-contracts','pine2ast','ast2python','pinelib','backtest_engine','marketdata-provider','optimizer'}
          if set(pins) != required or not all(re.fullmatch('[0-9a-f]{40}', s) for s in pins.values()):
              raise SystemExit('Invalid stack source identities')
          paths = []
          for name, sha in pins.items():
              path = root / name
              subprocess.run(['git','clone','--quiet','https://github.com/s7cret/' + name + '.git', str(path)], check=True)
              subprocess.run(['git','-C',str(path),'checkout','--detach',sha], check=True)
              actual = subprocess.check_output(['git','-C',str(path),'rev-parse','HEAD'], text=True).strip()
              if actual != sha:
                  raise SystemExit('Source checkout identity mismatch')
              paths.append(str(path))
          subprocess.run(['python','-m','pip','install',*paths,'.[dev]'], check=True)
          (evidence / 'source-pins.json').write_text(json.dumps(pins, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('PINE_STACK_ROOT=' + str(root) + '\n')
          PY
      - name: Full contracts, runtime, compiler and broker functional suites
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          for repo in openpine-contracts pinelib ast2python backtest_engine; do
            (cd "$PINE_STACK_ROOT/$repo" && python -m pytest -q --junitxml="$RUNNER_TEMP/review-evidence/$repo.xml")
          done
      - name: Install sandbox without disabling its protections
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y apparmor-profiles apparmor-utils bubblewrap
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          if ! getent passwd openpine-worker >/dev/null; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin openpine-worker
          fi
          sudo -n -u openpine-worker -- /usr/bin/id -u
          /usr/bin/bwrap --ro-bind / / --unshare-net -- /usr/bin/true
      - name: Native RC6, actual sandbox and selected branch regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -p pytest_asyncio.plugin -q rc6_tests \
            tests/test_migration_upgrade_020.py tests/test_migration_upgrade_021.py \
            tests/test_provider_adapter.py tests/test_data_orchestrator_source_policy.py \
            tests/test_data_series_delete_canonical_market.py tests/test_strategy_semantic_profile_immutable.py \
            tests/test_strategy_create_semantic_profile.py tests/test_strategy_update_semantic_profile.py \
            tests/test_gateway_worker_supervision.py tests/test_job_v1_transactions.py \
            tests/test_strategy_job_executor.py tests/test_strategy_ledger.py tests/test_strategy_registry.py \
            tests/test_strategy_fanout.py tests/test_phase_a_hot_paths.py \
            tests/test_periodic_fetcher_grouping.py tests/test_market_provider_runtime.py \
            tests/test_render_immutable_identity_env.py tests/test_infra_hardening.py \
            tests/test_run_admission_integration.py tests/test_runtime_engine_adapter.py \
            tests/test_optimizer_isolated_search.py tests/test_optimizer_search_route.py \
            tests/test_optimizer_semantic_profile.py tests/test_backtest_gateway_market_metadata.py \
            tests/test_backtest_semantic_profile.py tests/test_cli_semantic_profile.py tests/test_bulk_backtest.py \
            --junitxml="$RUNNER_TEMP/review-evidence/openpine.xml"
      - name: Build OpenPine and retain environment evidence
        run: |
          mkdir -p "$RUNNER_TEMP/build-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/build-source"
          python -m build --no-isolation --outdir "$RUNNER_TEMP/review-evidence/dist" "$RUNNER_TEMP/build-source"
          python -m pip freeze > "$RUNNER_TEMP/review-evidence/environment.txt"
          cp "$RUNNER_TEMP/reviewed-publisher.py" "$RUNNER_TEMP/review-evidence/reviewed-publisher.py"
          git status --porcelain > "$RUNNER_TEMP/review-evidence/post-test-worktree.txt"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/review-evidence/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-3.13-${{ github.run_id }}
          path: evidence
      - name: Fast-forward only the fully verified candidate
        run: python evidence/reviewed-publisher.py publish evidence
