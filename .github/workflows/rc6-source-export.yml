name: Export exact saved source snapshots for independent local review
'on':
  push:
    branches: ['codex/recursive-method-contracts-20260908']
    paths: ['.github/workflows/rc6-source-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8aa6a3e4f6f172652daf3ba37aade9f21e122c6c
          fetch-depth: 0
          persist-credentials: false
      - name: Archive the exact candidate and corresponding accepted baselines
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          base='4a84ff2873caef95d8eb986dc1e999c379f33fbf';head='8aa6a3e4f6f172652daf3ba37aade9f21e122c6c'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'sources';out.mkdir()
          def git(root,*a):return subprocess.check_output(['git','-C',str(root),*a],text=True).strip()
          host=pathlib.Path.cwd()
          sets={label:{**json.loads(git(host,'show',ref+':docs/RC6_LIFECYCLE_SOURCES.json')),'openpine':ref} for label,ref in [('baseline',base),('candidate',head)]}
          receipts={}
          for name in sets['candidate']:
              root=host if name=='openpine' else pathlib.Path(os.environ['RUNNER_TEMP'])/name
              if name!='openpine': subprocess.run(['git','clone','--quiet','https://github.com/s7cret/'+name+'.git',str(root)],check=True)
              for label,pins in sets.items():
                  sha=pins[name]
                  path=out/(label+'-'+name+'.tar.gz')
                  subprocess.run(['git','-C',str(root),'archive','--format=tar.gz','--output='+str(path),sha],check=True)
                  receipts[path.name]={'repository':'s7cret/'+name,'commit':sha,'tree':git(root,'rev-parse',sha+'^{tree}'),'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
          (out/'source-identities.json').write_text(json.dumps(receipts,indent=2)+'\n')
          print(json.dumps(receipts,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rc6-independent-sources-${{ github.run_id }}
          path: ${{ runner.temp }}/sources/
          if-no-files-found: error
          retention-days: 30
