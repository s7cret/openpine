name: OpenPine Stack CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stack-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenPine
        uses: actions/checkout@v4
        with:
          path: openpine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install candidate build tooling
        run: python -m pip install --upgrade build
      - name: Materialize immutable stack candidate
        working-directory: openpine
        run: |
          mkdir -p "$RUNNER_TEMP/openpine-candidate"
          python scripts/materialize_stack_candidate.py \
            --template candidates/stack-candidate-5.0.0-rc.6.template.json \
            --openpine-sha "$GITHUB_SHA" \
            --created-at-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --builder github-actions \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --source-uri "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/openpine-candidate/stack-candidate-5.0.0-rc.6.json"
      - name: Resolve active stack candidate
        id: stack
        working-directory: openpine
        run: >-
          python scripts/resolve_stack_candidate.py
          --root "$RUNNER_TEMP/openpine-candidate"
          --github-output "$GITHUB_OUTPUT"
      - name: Checkout OpenPine Contracts candidate
        if: ${{ steps.stack.outputs.mode == 'candidate' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.stack.outputs.openpine_contracts_repo }}
          ref: ${{ steps.stack.outputs.openpine_contracts_sha }}
          path: openpine-contracts
      - name: Checkout Pine2AST
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.stack.outputs.pine2ast_repo || 's7cret/pine2ast' }}
          ref: ${{ steps.stack.outputs.pine2ast_sha || 'c5d1a1826739fe439f506452e456ae61b1ca59dc' }}
          path: pine2ast
      - name: Checkout AST2Python
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.stack.outputs.ast2python_repo || 's7cret/ast2python' }}
          ref: ${{ steps.stack.outputs.ast2python_sha || '4a62199971a55dc341b43a74863c97ba6a701f51' }}
          path: ast2python
      - name: Checkout PineLib
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.stack.outputs.pinelib_repo || 's7cret/pinelib' }}
          ref: ${{ steps.stack.outputs.pinelib_sha || '11d0aeb7ce932d20cb8c274a0ed0bea17e685058' }}
          path: pinelib
      - name: Checkout Backtest Engine
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.stack.outputs.backtest_engine_repo || 's7cret/backtest_engine' }}
          ref: ${{ steps.stack.outputs.backtest_engine_sha || 'da66a70bd5dba2bdfdf4c5eab47ef02f2cbee200' }}
          path: backtest_engine
      - name: Checkout Marketdata Provider
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.stack.outputs.marketdata_provider_repo || 's7cret/marketdata-provider' }}
          ref: ${{ steps.stack.outputs.marketdata_provider_sha || '2aceac9681ffc191780e2ff2254ba4ee88592cd0' }}
          path: marketdata-provider
      - name: Checkout Optimizer
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.stack.outputs.optimizer_repo || 's7cret/optimizer' }}
          ref: ${{ steps.stack.outputs.optimizer_sha || '36cd2e7aa7ad2142d939a42928e5403a5b88aa7a' }}
          path: optimizer
      - name: Verify candidate checkout identities
        if: ${{ steps.stack.outputs.mode == 'candidate' }}
        run: |
          python openpine/scripts/build_candidate_wheelhouse.py \
            --candidate "$RUNNER_TEMP/openpine-candidate/${{ steps.stack.outputs.candidate_path }}" \
            --outdir "$RUNNER_TEMP/openpine-wheelhouse" \
            --checkout openpine-contracts=openpine-contracts \
            --checkout marketdata-provider=marketdata-provider \
            --checkout pinelib=pinelib \
            --checkout backtest_engine=backtest_engine \
            --checkout pine2ast=pine2ast \
            --checkout ast2python=ast2python \
            --checkout optimizer=optimizer \
            --checkout openpine=openpine \
            --build
      - name: Finalize and clean-install wheel-bound candidate
        if: ${{ steps.stack.outputs.mode == 'candidate' }}
        run: |
          python -m pip install -U pip
          python openpine/scripts/finalize_stack_candidate.py \
            --candidate "$RUNNER_TEMP/openpine-candidate/${{ steps.stack.outputs.candidate_path }}" \
            --wheelhouse "$RUNNER_TEMP/openpine-wheelhouse" \
            --output "$RUNNER_TEMP/openpine-candidate/stack-candidate-5.0.0-rc.6.wheels.json"
          python -m venv "$RUNNER_TEMP/openpine-candidate-venv"
          "$RUNNER_TEMP/openpine-candidate-venv/bin/python" \
            openpine/scripts/install_candidate_wheelhouse.py \
            --candidate "$RUNNER_TEMP/openpine-candidate/stack-candidate-5.0.0-rc.6.wheels.json" \
            --wheelhouse "$RUNNER_TEMP/openpine-wheelhouse" \
            --python "$RUNNER_TEMP/openpine-candidate-venv/bin/python" \
            --install
      - name: Verify installed stack versions
        run: |
          "$RUNNER_TEMP/openpine-candidate-venv/bin/python" - <<'PY'
          from importlib.metadata import version

          expected = {
              'openpine': '5.0.0rc6',
              'openpine-contracts': '5.0.0rc6',
              'pine2ast': '5.0.0rc6',
              'ast2python': '5.0.0rc6',
              'pinelib': '5.0.0rc6',
              'backtest-engine': '5.0.0rc6',
              'marketdata-provider': '5.0.0rc6',
              'optimizer': '5.0.0rc6',
          }
          for distribution, wanted in expected.items():
              installed = version(distribution)
              if installed != wanted:
                  raise SystemExit(
                      f'{distribution}: expected {wanted}, got {installed!r}'
                  )
              print(distribution, installed)
          PY
      - name: Cross-project compiler/runtime E2E
        env:
          PINE_STACK_ROOT: ${{ github.workspace }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          "$RUNNER_TEMP/openpine-candidate-venv/bin/python" -m pip install pytest
          "$RUNNER_TEMP/openpine-candidate-venv/bin/python" -m pytest -q \
            ast2python/tests/integration/test_v1_0_cross_project_e2e.py
      - name: OpenPine production release report
        if: ${{ steps.stack.outputs.mode == 'production' }}
        run: (cd openpine && python -m openpine.release --root .)
      - name: OpenPine feature candidate report
        if: ${{ steps.stack.outputs.mode == 'candidate' }}
        working-directory: openpine
        run: |
          "$RUNNER_TEMP/openpine-candidate-venv/bin/python" -m pytest -q \
            tests/test_stack_candidate.py
      - name: Production sibling release reports
        if: ${{ steps.stack.outputs.mode == 'production' }}
        run: |
          (cd pine2ast && python -m pine2ast.release --root .)
          (cd ast2python && python -m ast2python.release --root .)
          (cd pinelib && python -m pinelib.release --root .)
          (cd backtest_engine && python -m backtest_engine.release --root .)
          (cd marketdata-provider && python -m marketdata_provider.release --root .)
          (cd optimizer && python -m optimizer.release --root .)
