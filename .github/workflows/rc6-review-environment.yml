name: RC6 offline verification environment

on:
  workflow_dispatch:
  push:
    branches: ['release/5.0.0rc6']
    paths: ['.github/workflows/rc6-review-environment.yml']

permissions:
  contents: read

jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve third-party verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          python -m pip download --only-binary=:all: --dest wheelhouse \
            'setuptools>=77' wheel 'hatchling>=1.21' 'build>=1.2' \
            'pytest>=8' 'pytest-cov>=6' 'pytest-asyncio>=1.4' 'ruff>=0.6' 'mypy>=1.11' \
            'click>=8.1' 'rich>=13' 'pyyaml>=6' 'msgpack>=1,<2' 'pydantic>=2' \
            'structlog>=24' 'fastapi>=0.115,<0.137' 'starlette>=1.3.1,<1.7' \
            'python-multipart>=0.0.9' 'uvicorn[standard]>=0.32' 'websockets>=14' \
            'pandas>=2' 'pyarrow>=15' 'httpx>=0.28' 'jsonschema>=4.20,<5' \
            'tzdata==2026.2' 'typing-extensions>=4' 'matplotlib>=3.8' \
            'socksio>=1,<2' 'zstandard>=0.22'
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import platform
          import sys
          root = pathlib.Path('wheelhouse')
          manifest = {'schema_version': 1, 'python': sys.version,
                      'platform': platform.platform(),
                      'purpose': 'verification dependency closure, not a product release',
                      'wheels': []}
          for path in sorted(root.glob('*.whl')):
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1048576), b''):
                      digest.update(chunk)
              manifest['wheels'].append({'file': path.name, 'sha256': digest.hexdigest()})
          (root / 'verification-environment.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rc6-offline-environment-py311-${{ github.sha }}
          path: wheelhouse/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
