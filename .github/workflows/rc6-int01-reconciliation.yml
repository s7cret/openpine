# One exact working candidate; native integration does not authorize release.
name: RC6 INT01 stack reconciliation
'on':
  pull_request:
    branches: ['implementation/p0-remaining-spec-20261006']
permissions:
  contents: read
concurrency:
  group: rc6-int01-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  candidate:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Bind exact host checkout and interpreter
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD HEAD^{tree}
          python -c "import sys; assert sys.version_info[:3] == (3,13,5); assert sys._is_gil_enabled(); print(sys.version)"
      - name: Install hashed build and verification dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r verification/ci-bootstrap-requirements.txt -r verification/ci-runtime-requirements.txt
      - name: Prepare clean eight-wheel candidate and complete native inventories
        run: python -m openpine.verification test-ci prepare --host-root "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/int01-work" --python-version 3.13
      - name: Verify installed package origins, ABI and required live inventory
        run: |
          PY="$RUNNER_TEMP/int01-work/venv/bin/python"
          mkdir -p "$RUNNER_TEMP/int01-evidence"
          "$PY" -I scripts/rc6_stabilization/probe.py api --output "$RUNNER_TEMP/int01-evidence/api.json"
          "$PY" - <<'PYREQUIRED'
          import json, os, pathlib
          from openpine.verification.required_inventory import pending_required_inventories
          work=pathlib.Path(os.environ['RUNNER_TEMP'])/'int01-work'
          collection=json.loads((work/'bundle/collection.json').read_text())
          roots={k:pathlib.Path(v) for k,v in collection['roots'].items()}
          policy=json.loads((roots['openpine']/'verification/execution-policy.json').read_text())
          pending=pending_required_inventories(policy,roots,collection['source'],collection['inventories'],list(roots))
          assert pending['marketdata-provider']['full_count']==902
          assert len(pending['marketdata-provider']['nodeids'])==5
          assert pending['marketdata-provider']['execution_pass'] is False
          bundle=json.loads((work/'bundle/bundle.json').read_text())
          commits={'openpine':bundle['host_commit'],**bundle['source_pins']}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'int01-evidence/commits.json').write_text(json.dumps(commits))
          print(json.dumps({'pending_required_inventories':pending,'release_authorized':False},sort_keys=True))
          PYREQUIRED
          "$PY" -I scripts/rc6_stabilization/probe.py runtime --commits "$RUNNER_TEMP/int01-evidence/commits.json" --output "$RUNNER_TEMP/int01-evidence/runtime.json"
          "$PY" -I scripts/rc6_stabilization/probe.py library --commits "$RUNNER_TEMP/int01-evidence/commits.json" --output "$RUNNER_TEMP/int01-evidence/library.json"
      - name: Prepare installed-package test runner
        run: |
          cat > "$RUNNER_TEMP/int01-installed-tests.py" <<'PYTEST'
          import importlib, json, pathlib, sys
          import pytest
          assert sys.flags.isolated
          prefixes=('openpine','openpine_contracts','pine2ast','ast2python','pinelib','backtest_engine','marketdata_provider','optimizer')
          prefix=pathlib.Path(sys.prefix).resolve()
          for name in prefixes:
              module=importlib.import_module(name)
              assert pathlib.Path(module.__file__).resolve().is_relative_to(prefix)
          output=pathlib.Path(sys.argv[1])
          sys.path.append(str(pathlib.Path.cwd()))
          result=pytest.main(['--import-mode=importlib',*sys.argv[2:]])
          origins={name:str(pathlib.Path(module.__file__).resolve()) for name,module in sys.modules.items() if any(name==p or name.startswith(p+'.') for p in prefixes) and getattr(module,'__file__',None)}
          assert all(pathlib.Path(path).is_relative_to(prefix) for path in origins.values()), origins
          output.write_text(json.dumps({'pytest_returncode':int(result),'installed_module_origins':origins},sort_keys=True))
          raise SystemExit(result)
          PYTEST
      - name: Execute the formerly skipped PineLib publication obligation
        run: |
          PY="$RUNNER_TEMP/int01-work/venv/bin/python"
          "$PY" -I "$RUNNER_TEMP/int01-installed-tests.py" "$RUNNER_TEMP/int01-evidence/pinelib-origins.json" -q "$RUNNER_TEMP/int01-work/stack/pinelib/tests/test_stage210_publication.py::test_stage210_unpublished_runtime_abi_change_stops_publication" -p openpine.verification.pytest_gate --verification-suite=int01-pinelib-publication --verification-output="$RUNNER_TEMP/int01-evidence/pinelib-publication.json" --junitxml="$RUNNER_TEMP/int01-evidence/pinelib-publication.xml" -o cache_dir="$RUNNER_TEMP/int01-evidence/cache"
      - name: Execute host reconciliation and producer/compiler/runtime boundaries
        env:
          PINE_STACK_ROOT: ${{ runner.temp }}/int01-work/stack
        run: |
          PY="$RUNNER_TEMP/int01-work/venv/bin/python"
          "$PY" -I "$RUNNER_TEMP/int01-installed-tests.py" "$RUNNER_TEMP/int01-evidence/host-origins.json" -q tests/test_stack_candidate.py tests/test_candidate_materialization.py rc6_tests/test_rc6_required_inventory.py rc6_tests/test_rc6_stabilization_environment.py rc6_tests/test_rc6_reconciliation_inventory.py rc6_tests/test_rc6_marketdata_boundary.py rc6_tests/test_rc6_generated_checkpoint.py rc6_tests/test_rc6_inputs.py -p openpine.verification.pytest_gate --verification-suite=int01-host --verification-output="$RUNNER_TEMP/int01-evidence/host.json" --junitxml="$RUNNER_TEMP/int01-evidence/host.xml" -o cache_dir="$RUNNER_TEMP/int01-evidence/cache"
      - name: Native quality checks
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          export PATH="$RUNNER_TEMP/int01-work/venv/bin:$PATH"
          bash scripts/rc6_native_quality.sh
          python -m ruff check openpine/verification/required_inventory.py rc6_tests/test_rc6_required_inventory.py rc6_tests/stabilization_fixture.py rc6_tests/test_rc6_stabilization_environment.py tests/test_stack_candidate.py
      - name: Retain bounded public primary receipts in job logs
        if: always()
        run: |
          python - <<'PYLOG'
          import hashlib, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'int01-evidence'
          for path in sorted([*root.glob('*.json'),*root.glob('*.xml')]):
              data=path.read_bytes()
              assert len(data)<1024*1024
              print('PRIMARY',path.name,hashlib.sha256(data).hexdigest(),len(data))
              print(data.decode())
          PYLOG
