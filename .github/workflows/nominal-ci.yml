# Temporary operations workflow; source is checked out at the explicit immutable SHA.
# Read-only CI. This workflow never updates release branches or accepts Stage 2.
name: Nominal types Linux inventory proposal (collection only)
'on':
  push:
    branches:
    - stage2/nominal-ci-20260907
permissions:
  contents: read
concurrency:
  group: nominal-inventory proposal (collection only)-${{ github.ref }}
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.11'
        - '3.13'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 6b3ac81b46575d2bc105cfda334348b1a62387c7
        persist-credentials: false
        path: baseline
    - uses: actions/checkout@v4
      with:
        ref: 62b7b19491d8a20dfebca23546ca110becbfcc6a
        persist-credentials: false
        path: candidate
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - name: Collect exact baseline and candidate inventories with real installed dependencies
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/nominal_collect_inventory.py" <<'NOMINAL_COLLECTOR'
        """Linux-only, collection-only proposal; never execution/Stage 2 acceptance."""

        from __future__ import annotations

        import argparse
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import subprocess
        import sys


        PRE_NOMINAL_BASELINE_SHA = "668d009a5754fac138431a83dfc7eb83f73f408e"
        BASELINE_SHA = "6b3ac81b46575d2bc105cfda334348b1a62387c7"
        REPOSITORIES = (
            "openpine-contracts", "pinelib", "pine2ast", "ast2python",
            "backtest_engine", "optimizer", "marketdata-provider",
        )
        SUITES = (*REPOSITORIES, "openpine")
        BOOTSTRAP = ("setuptools==84.0.0", "wheel==0.48.0", "hatchling==1.32.0", "build==1.6.0")


        def run(command: list[str], *, cwd: Path | None = None, env: dict | None = None) -> None:
            subprocess.run(command, cwd=cwd, env=env, check=True)


        def output(command: list[str], *, cwd: Path | None = None) -> str:
            return subprocess.check_output(command, cwd=cwd, text=True).strip()


        def write_json(path: Path, value: object) -> None:
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_text(json.dumps(value, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")


        def hash_nodes(nodes: list[str]) -> str:
            data = json.dumps(sorted(nodes), ensure_ascii=False, separators=(",", ":")).encode()
            return "sha256:" + hashlib.sha256(data).hexdigest()


        def check_sha(value: str) -> str:
            if re.fullmatch(r"[0-9a-f]{40}", value) is None:
                raise ValueError("An exact lower-case source SHA is required")
            return value


        def source_snapshot(source: Path, sha: str, evidence: Path, name: str) -> None:
            if output(["git", "rev-parse", "HEAD"], cwd=source) != sha:
                raise ValueError(f"Wrong checkout for {name}")
            if output(["git", "status", "--porcelain", "--untracked-files=no"], cwd=source):
                raise ValueError(f"Dirty tracked checkout for {name}")
            run(["git", "archive", "--format=tar.gz", f"--output={evidence / (name + '.source.tar.gz')}", sha], cwd=source)


        def install_archive(source: Path, destination: Path, sha: str) -> None:
            destination.mkdir(parents=True)
            archive = subprocess.check_output(["git", "archive", sha], cwd=source)
            subprocess.run(["tar", "-x", "-C", str(destination)], input=archive, check=True)


        def collect_phase(label: str, host: Path, host_sha: str, work: Path, evidence: Path) -> dict:
            phase = work / label
            phase.mkdir()
            evidence.mkdir(parents=True)
            source_snapshot(host, host_sha, evidence, "openpine")
            pins = json.loads((host / "docs/RC6_LIFECYCLE_SOURCES.json").read_text())
            if set(pins) != set(REPOSITORIES):
                raise ValueError(f"{label}: seven source pins are required")
            for sha in pins.values():
                check_sha(sha)
            write_json(evidence / "source-pins.json", pins)
            write_json(evidence / "host-identity.json", {
                "sha": host_sha,
                "tree": output(["git", "rev-parse", "HEAD^{tree}"], cwd=host),
                "collection_only": True,
                "execution_acceptance": False,
            })
            run([sys.executable, "-m", "venv", str(phase / "venv")])
            python = str(phase / "venv/bin/python")
            env = dict(os.environ)
            env.pop("PYTHONPATH", None)
            env["PYTEST_DISABLE_PLUGIN_AUTOLOAD"] = "1"
            run([python, "-m", "pip", "install", *BOOTSTRAP], env=env)
            paths = {}
            archives = []
            for name in REPOSITORIES:
                path = phase / "stack" / name
                run(["git", "clone", "--quiet", "https://github.com/s7cret/" + name + ".git", str(path)])
                run(["git", "checkout", "--detach", pins[name]], cwd=path)
                source_snapshot(path, pins[name], evidence, name)
                clean = phase / "install-sources" / name
                install_archive(path, clean, pins[name])
                extras = "[parquet,stream,zstd]" if name == "marketdata-provider" else "[dev]" if name == "optimizer" else ""
                archives.append(str(clean) + extras)
                paths[name] = path
            clean_host = phase / "install-sources/openpine"
            install_archive(host, clean_host, host_sha)
            # Normal non-editable installs of all eight pinned packages. No PYTHONPATH,
            # sibling import injection, local stubs, or replacements for real dependencies.
            run([python, "-m", "pip", "install", *archives, str(clean_host) + "[dev]"], env=env)
            paths["openpine"] = host
            installed_probe = r'''
        import importlib, importlib.metadata, json, pathlib, sys
        names = {
            "openpine": "openpine", "openpine-contracts": "openpine_contracts",
            "pinelib": "pinelib", "pine2ast": "pine2ast", "ast2python": "ast2python",
            "backtest_engine": "backtest_engine", "optimizer": "optimizer",
            "marketdata-provider": "marketdata_provider",
        }
        prefix = pathlib.Path(sys.prefix).resolve()
        result = {}
        for distribution, module in names.items():
            imported = importlib.import_module(module)
            origin = pathlib.Path(imported.__file__).resolve()
            if not origin.is_relative_to(prefix):
                raise SystemExit("Package is outside its isolated installation: " + str(origin))
            dist = importlib.metadata.distribution(distribution)
            direct = json.loads(dist.read_text("direct_url.json") or "{}")
            if direct.get("dir_info", {}).get("editable", False):
                raise SystemExit("Editable package installation is forbidden")
            result[distribution] = {"origin": str(origin), "version": dist.version, "direct_url": direct}
        print(json.dumps(result, indent=2))
        '''
            imports = subprocess.check_output([python, "-I", "-c", installed_probe], cwd=phase, env=env, text=True)
            (evidence / "installed-package-origins.json").write_text(imports, encoding="utf-8")
            freeze = subprocess.check_output([python, "-m", "pip", "freeze"], env=env, text=True)
            (evidence / "environment.txt").write_text(freeze, encoding="utf-8")
            selected = json.loads((host / "rc6_tests/selected_regressions.json").read_text())
            if (not isinstance(selected, list) or not all(isinstance(p, str) for p in selected)
                    or len(set(selected)) != len(selected)
                    or any(not p.startswith("tests/test_") or not p.endswith(".py")
                           or not (host / p).is_file() for p in selected)):
                raise ValueError("Invalid explicit regression inventory")
            write_json(evidence / "selected-tests.json", sorted(selected))
            results = {}
            failures = []
            for suite in SUITES:
                inventory = evidence / f"{suite}.inventory.json"
                command = [python, "-m", "pytest", "-q", "--collect-only"]
                if suite == "openpine":
                    command += ["-p", "pytest_asyncio.plugin"]
                command += ["-p", "openpine.verification.pytest_gate",
                            "--verification-suite=" + suite, "--verification-output=" + str(inventory)]
                if label == "baseline":
                    command += ["--verification-lock=" + str(host / "verification/inventory.json")]
                if suite == "marketdata-provider":
                    command += ["-m", "not live_network"]
                if suite == "openpine":
                    command += ["rc6_tests", *sorted(selected)]
                print("::group::" + label + ": collect " + suite, flush=True)
                result = subprocess.run(command, cwd=paths[suite], env=env, capture_output=True, text=True)
                log = result.stdout + result.stderr
                (evidence / f"{suite}.collection.log").write_text(log, encoding="utf-8")
                print(log, flush=True)
                print("::endgroup::", flush=True)
                if result.returncode:
                    failures.append(f"{suite}: pytest collection exit {result.returncode}")
                if not inventory.is_file():
                    failures.append(f"{suite}: no inventory output")
                    continue
                rows = json.loads(inventory.read_text())
                nodes = rows.get("nodeids")
                if (not isinstance(nodes, list) or not nodes or not all(isinstance(n, str) for n in nodes)
                        or len(set(nodes)) != len(nodes)
                        or rows.get("suite") != suite or rows.get("collect_only") is not True
                        or rows.get("ok") is not False or rows.get("errors") != []
                        or rows.get("count") != len(nodes) or rows.get("sha256") != hash_nodes(nodes)
                        or type(rows.get("deselected")) is not int or rows["deselected"] < 0):
                    failures.append(f"{suite}: malformed or failed collection evidence")
                    continue
                results[suite] = rows
            write_json(evidence / "collection-status.json", {
                "errors": failures, "collection_only": True, "execution_acceptance": False,
            })
            if failures:
                raise ValueError("; ".join(failures))
            return results


        def compare(baseline: dict, candidate: dict, locked: dict,
                    baseline_sha: str = BASELINE_SHA) -> tuple[dict, dict]:
            check_sha(baseline_sha)
            if set(baseline) != set(SUITES) or set(candidate) != set(SUITES) or set(locked) != set(SUITES):
                raise ValueError("All eight suites must be present")
            proposal = {}
            changes = {}
            failures = []
            for suite in SUITES:
                old, new = baseline[suite], candidate[suite]
                old_identity = {key: old[key] for key in ("count", "sha256", "deselected")}
                expected = {**locked[suite], "deselected": locked[suite].get("deselected", 0)}
                if old_identity != expected:
                    failures.append(f"{suite}: baseline differs from frozen {baseline_sha} inventory")
                added = sorted(set(new["nodeids"]) - set(old["nodeids"]))
                removed = sorted(set(old["nodeids"]) - set(new["nodeids"]))
                if removed:
                    failures.append(f"{suite}: candidate removed baseline nodeids")
                if new["deselected"] > old["deselected"]:
                    failures.append(f"{suite}: candidate increased deselections")
                proposal[suite] = {key: new[key] for key in ("count", "sha256", "deselected")}
                changes[suite] = {
                    "baseline": old_identity, "candidate": proposal[suite],
                    "added": added, "removed": removed,
                    "deselected_delta": new["deselected"] - old["deselected"],
                }
            return proposal, {
                "baseline_host_sha": baseline_sha,
                "collection_only": True, "execution_acceptance": False,
                "review_required": True, "errors": failures, "suites": changes,
            }


        def main() -> None:
            parser = argparse.ArgumentParser(description=__doc__)
            parser.add_argument("--baseline", required=True, type=Path)
            parser.add_argument("--baseline-sha", type=check_sha, default=BASELINE_SHA)
            parser.add_argument("--candidate", required=True, type=Path)
            parser.add_argument("--candidate-sha", required=True, type=check_sha)
            parser.add_argument("--work", required=True, type=Path)
            parser.add_argument("--evidence", required=True, type=Path)
            args = parser.parse_args()
            if sys.platform != "linux":
                raise SystemExit("Run this proposal collector on the real Linux CI runner")
            args.work.mkdir(parents=True)
            args.evidence.mkdir(parents=True)
            baseline = collect_phase("baseline", args.baseline.resolve(), args.baseline_sha,
                                     args.work.resolve(), args.evidence.resolve() / "baseline")
            candidate = collect_phase("candidate", args.candidate.resolve(), args.candidate_sha,
                                      args.work.resolve(), args.evidence.resolve() / "candidate")
            locked = json.loads((args.baseline / "verification/inventory.json").read_text())
            proposal, differences = compare(baseline, candidate, locked, args.baseline_sha)
            differences["candidate_host_sha"] = args.candidate_sha
            write_json(args.evidence / "baseline-locked-inventory.json", locked)
            write_json(args.evidence / "inventory-diff.json", differences)
            # Failed comparisons remain reviewable without producing an installable lock.
            if differences["errors"]:
                raise SystemExit("; ".join(differences["errors"]))
            write_json(args.evidence / "proposed-inventory.json", proposal)
            (args.evidence / "NOT-EXECUTION-ACCEPTANCE.txt").write_text(
                "Collection only. Review added/removed nodeids, commit the approved lock, "
                "then run the unchanged permanent backend and frontend gates at that exact source SHA.\n",
                encoding="utf-8",
            )


        if __name__ == "__main__":
            main()
        NOMINAL_COLLECTOR
        python "$RUNNER_TEMP/nominal_collect_inventory.py" --baseline "$GITHUB_WORKSPACE/baseline" --candidate "$GITHUB_WORKSPACE/candidate" --baseline-sha 6b3ac81b46575d2bc105cfda334348b1a62387c7 --candidate-sha 62b7b19491d8a20dfebca23546ca110becbfcc6a --work "$RUNNER_TEMP/nominal-collection" --evidence "$RUNNER_TEMP/nominal-proposal"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: nominal-proposal-${{ matrix.python }}-${{ github.run_id }}
        path: ${{ runner.temp }}/nominal-proposal/
        if-no-files-found: error
        retention-days: 30
