name: Stack source evidence

on:
  workflow_dispatch:
  push:
    branches: ['release/5.0.0rc6']
    paths: ['.github/workflows/stack-source-evidence.yml']

permissions:
  contents: read

jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact source histories and reference inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence mirrors
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          repos = ['openpine', 'openpine-contracts', 'pine2ast', 'ast2python',
                   'pinelib', 'backtest_engine', 'marketdata-provider', 'optimizer']
          pins = json.loads(pathlib.Path('docs/RC6_LIFECYCLE_SOURCES.json').read_text())
          if set(pins) != set(repos) - {'openpine'} or not all(
                  isinstance(sha, str) and re.fullmatch('[0-9a-f]{40}', sha)
                  for sha in pins.values()):
              raise SystemExit('Invalid triggering stack source identities')
          pins['openpine'] = os.environ['GITHUB_SHA']
          manifest = {'schema_version': 2, 'purpose': 'source evidence, not release approval',
                      'openpine_trigger_sha': os.environ['GITHUB_SHA'],
                      'source_pins': pins, 'repositories': []}
          for name in repos:
              mirror = pathlib.Path('mirrors') / (name + '.git')
              subprocess.run(['git', 'clone', '--mirror',
                              'https://github.com/s7cret/' + name + '.git', str(mirror)],
                             check=True)
              actual = subprocess.check_output(
                  ['git', '-C', str(mirror), 'rev-parse', pins[name] + '^{commit}'],
                  text=True).strip()
              if actual != pins[name]:
                  raise SystemExit('Pinned source commit is missing: ' + name)
              subprocess.run(['git', '-C', str(mirror), 'update-ref',
                              'refs/evidence/trigger-source', actual], check=True)
              subprocess.run(['git', '-C', str(mirror), 'fsck', '--full', '--no-dangling'],
                             check=True)
              bundle = (pathlib.Path('evidence') / (name + '.bundle')).resolve()
              subprocess.run(['git', '-C', str(mirror), 'bundle', 'create', str(bundle), '--all'],
                             check=True)
              subprocess.run(['git', '-C', str(mirror), 'bundle', 'verify', str(bundle)], check=True)
              refs = subprocess.check_output(
                  ['git', '-C', str(mirror), 'for-each-ref', '--format=%(refname) %(objectname)'],
                  text=True).splitlines()
              digest = hashlib.sha256()
              with bundle.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1048576), b''):
                      digest.update(chunk)
              manifest['repositories'].append({'repository': 's7cret/' + name,
                                                'bundle': bundle.name,
                                                'source_sha': actual,
                                                'sha256': digest.hexdigest(), 'refs': refs})
          pathlib.Path('evidence/source-manifest.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stack-source-evidence-${{ github.sha }}
          path: evidence/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
