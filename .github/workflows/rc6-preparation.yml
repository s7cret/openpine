# Bounded preparation evidence only; full owner qualification remains separate.
name: RC6 preparation baseline
'on':
  push:
    branches: ['preparation/rc6-cpython313-20261006']
  workflow_dispatch:
    inputs:
      int05_control_calibration:
        description: 'Reviewed INT05 stock prepare and ONE complete pytest control; no mutant campaigns'
        type: boolean
        required: true
        default: false
      reviewed_workflow_sha:
        description: 'Exact workflow commit approved by the parent; empty disables INT05 dispatch'
        required: false
        default: ''
      public_evidence_approved:
        description: 'Run only after approval of the public evidence allowlist and storage route'
        type: boolean
        required: true
        default: true
      artifact_budget_bytes:
        description: 'Approved complete upload ceiling; 0 prevents the baseline run'
        required: true
        default: '134217728'
      retention_days:
        description: 'Approved evidence retention: exactly 1 day'
        required: true
        default: '1'
permissions:
  contents: read
concurrency:
  group: rc6-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  baseline:
    # Preparation branch pushes are approved within the recorded cumulative $0.10 budget.
    if: ${{ !inputs.int05_control_calibration && (github.event_name == 'push' || (inputs.public_evidence_approved && inputs.artifact_budget_bytes != '0')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      ARTIFACT_BUDGET: ${{ inputs.artifact_budget_bytes || '134217728' }}
      RETENTION_DAYS: ${{ inputs.retention_days || '1' }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13.5'
    - name: Verify interpreter and bounded runner capacity
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/preparation-raw"
        python - <<'PY'
        import json, os, pathlib, platform, shutil, sys, sysconfig
        from openpine.verification.execution_identity import environment_snapshot, validate_python_support
        root=pathlib.Path(os.environ['RUNNER_TEMP'])
        identity=environment_snapshot()
        validate_python_support(json.loads(pathlib.Path('verification/execution-policy.json').read_text()), identity)
        assert sys.version_info[:3] == (3,13,5)
        assert platform.freedesktop_os_release()['VERSION_ID']=='24.04'
        assert shutil.disk_usage(root).free >= 8*1024**3
        assert 0 < int(os.environ['ARTIFACT_BUDGET']) <= 128*1024**2
        assert int(os.environ['RETENTION_DAYS']) == 1
        report={'environment':identity,'cpu_count':os.cpu_count(),'disk':dict(zip(('total','used','free'),shutil.disk_usage(root))), 'artifact_budget_bytes':int(os.environ['ARTIFACT_BUDGET']), 'scope':'preparation, not full product qualification'}
        (root/'preparation-raw/runner.json').write_text(json.dumps(report,indent=2))
        print(json.dumps(report))
        PY
    - name: Bootstrap hashed owner dependencies
      run: |
        python -m pip install --require-hashes --only-binary=:all: -r verification/ci-bootstrap-requirements.txt -r verification/ci-runtime-requirements.txt
    - name: Provision existing protected worker prerequisites
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y apparmor-profiles apparmor-utils bubblewrap
        sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
        sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
        if ! getent passwd openpine-worker >/dev/null; then
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin openpine-worker
        fi
        sudo -n -u openpine-worker -- /usr/bin/id -u
        /usr/bin/bwrap --ro-bind / / --unshare-net -- /usr/bin/true
    - name: Prepare clean exact eight-package wheels and complete collections
      id: prepared
      run: python -m openpine.verification test-ci prepare --host-root "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/preparation-work" --python-version 3.13
    - name: Run affected preparation regressions and one existing real worker obligation
      if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
      id: smoke
      env:
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      run: |
        "$RUNNER_TEMP/preparation-work/venv/bin/python" -m pytest --noconftest -q rc6_tests/test_rc6_python_support.py rc6_tests/test_rc6_clean_build.py rc6_tests/test_rc6_evidence_archive.py rc6_tests/test_rc6_public_evidence.py rc6_tests/test_rc6_private_retention.py rc6_tests/test_rc6_execution_ci.py rc6_tests/test_rc6_reconciliation_inventory.py 'rc6_tests/test_rc6_chart_metadata.py::test_real_worker_hourly_metadata[interactive]' --junitxml="$RUNNER_TEMP/preparation-raw/junit.xml"
    - name: Seal available raw evidence and report exact outcome
      id: evidence
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY'
        import json,os,pathlib,shutil,subprocess
        root=pathlib.Path(os.environ['RUNNER_TEMP']); raw=root/'preparation-raw';raw.mkdir(exist_ok=True)
        work=root/'preparation-work'
        if (work/'commands').exists():shutil.copytree(work/'commands',raw/'commands')
        for name in ('bundle.json','collection.json','installed-origins.json','package-trees.json','installed-package-trees.json'):
          if (work/'bundle'/name).is_file():shutil.copy2(work/'bundle'/name,raw/name)
        if (work/'bundle/collection.evidence').is_dir():shutil.copytree(work/'bundle/collection.evidence',raw/'collection.evidence',ignore=shutil.ignore_patterns('private'))
        report={'commit':os.environ['GITHUB_SHA'],'run_id':'rc6-preparation-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'],'scope':'bounded preparation baseline','full_product_qualified':False}
        (raw/'summary.json').write_text(json.dumps(report,indent=2))
        (raw/'transport-scope.json').write_text(json.dumps({'scope':'preparation primary logs, collection receipts, JUnit and byte identities','excluded':'source archives, wheel build inputs, virtualenvs, caches, private temporary trees; these are not published','full_product_qualified':False},indent=2))
        subprocess.run(['python','-m','scripts.rc6_public_evidence','--root',str(raw),'--candidate',report['commit'],'--run-id',report['run_id'],'--max-bytes',str(128*1024**2),'--output',str(root/'public-evidence-audit.json')],check=True)
        args=['python','-m','openpine.verification.execution_evidence','archive','--evidence',str(raw),'--output',str(root/'preparation-archive'),'--source-root',os.environ['GITHUB_WORKSPACE'],'--candidate',report['commit'],'--run-id',report['run_id'],'--retention-days',os.environ['RETENTION_DAYS'],'--max-bytes',str(128*1024**2)]
        for source in (work/'stack').glob('*'):
          if source.is_dir():args.extend(['--source-root',str(source)])
        subprocess.run(args,check=True)
        manifest=json.loads((root/'preparation-archive/manifest.json').read_text())
        subprocess.run(['python','-m','openpine.verification.execution_evidence','verify','--archive',str(root/'preparation-archive/evidence.tar.gz'),'--manifest',str(root/'preparation-archive/manifest.json'),'--expected-manifest-hash',manifest['content_hash'],'--candidate',report['commit'],'--run-id',report['run_id']],check=True)
        print(json.dumps(manifest,indent=2))
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:
          f.write('manifest_hash='+manifest['content_hash']+'\n')
          f.write('archive_hash='+manifest['archive']['sha256']+'\n')
          f.write('archive_bytes='+str(manifest['archive']['size'])+'\n')
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('Preparation evidence manifest: `'+manifest['content_hash']+'`\n\n'+json.dumps(report)+'\n\nPublic evidence: complete upload capped at 128 MiB, retention 1 day, recorded cumulative storage budget $0.10.\n')
        if int(os.environ['ARTIFACT_BUDGET']):
          from scripts.rc6_public_evidence import check_upload_payload
          payload=check_upload_payload(root/'preparation-archive',root/'public-evidence-audit.json',max_bytes=int(os.environ['ARTIFACT_BUDGET']))
          print('Complete public upload budget:',json.dumps(payload))
        print('Public byte audit:', (root/'public-evidence-audit.json').read_text())
        PY
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() && steps.evidence.outcome == 'success' && env.ARTIFACT_BUDGET != '0' }}
      with:
        name: rc6-preparation-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/preparation-archive/
          ${{ runner.temp }}/public-evidence-audit.json
        retention-days: ${{ env.RETENTION_DAYS }}
        compression-level: 0
        if-no-files-found: error
  int05-control:
    # Review only: the current public allowlist cannot transport the complete inputs.
    # Do not dispatch until its owner supplies a reviewed durable route and free allowance.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.int05_control_calibration && inputs.reviewed_workflow_sha == github.sha && inputs.public_evidence_approved && inputs.artifact_budget_bytes != '0' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: candidate
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      INT05_WORKFLOW_SHA: ${{ github.sha }}
      ARTIFACT_BUDGET: ${{ inputs.artifact_budget_bytes }}
      RETENTION_DAYS: ${{ inputs.retention_days }}
      # Exact product policy floor; preflight reads it back independently.
      INT05_DISK_FLOOR: '2147483648'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Initialize bounded work and retention deadlines
      working-directory: ${{ runner.temp }}
      timeout-minutes: 1
      run: |
        INT05_JOB_EPOCH="$(date +%s)"
        printf 'INT05_WORK_DEADLINE_EPOCH=%s\nINT05_RETENTION_DEADLINE_EPOCH=%s\n' "$((INT05_JOB_EPOCH + 6000))" "$((INT05_JOB_EPOCH + 6600))" >> "$GITHUB_ENV"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        path: workflow-owner
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 4eee24fc458a2099f000211850f720ccfc6bfb2b
        path: candidate
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13.5'
    - name: Verify ordinary interpreter and hosted VM prerequisites
      run: |
        python "$GITHUB_WORKSPACE/workflow-owner/scripts/int05_hosted_control.py" preflight
    - name: Bounded hashed bootstrap
      run: |
        INT05_PYTHON="$(python -c 'import sys; print(sys.executable)')"
        PYTHONPATH="$PWD" "$INT05_PYTHON" "$GITHUB_WORKSPACE/workflow-owner/scripts/int05_monitor_stock_command.py" --output "$RUNNER_TEMP/int05/bootstrap-resource" --cwd "$PWD" --minimum-free-bytes "$INT05_DISK_FLOOR" --required-headroom-bytes 536870912 --deadline-epoch "$INT05_WORK_DEADLINE_EPOCH" -- "$INT05_PYTHON" -m pip install --require-hashes --only-binary=:all: -r verification/ci-bootstrap-requirements.txt
    - name: Provision existing protected worker prerequisites
      timeout-minutes: 5
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y apparmor-profiles apparmor-utils bubblewrap
        sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
        sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
        if ! getent passwd openpine-worker >/dev/null; then
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin openpine-worker
        fi
        sudo -n -u openpine-worker -- /usr/bin/id -u
        /usr/bin/bwrap --ro-bind / / --unshare-net -- /usr/bin/true
    - name: Stock prepare exact eight-package candidate
      run: |
        INT05_PYTHON="$(python -c 'import sys; print(sys.executable)')"
        PYTHONPATH="$PWD" "$INT05_PYTHON" "$GITHUB_WORKSPACE/workflow-owner/scripts/int05_monitor_stock_command.py" --output "$RUNNER_TEMP/int05/prepare-resource" --cwd "$PWD" --minimum-free-bytes "$INT05_DISK_FLOOR" --required-headroom-bytes 2147483648 --deadline-epoch "$INT05_WORK_DEADLINE_EPOCH" -- "$INT05_PYTHON" -m openpine.verification test-ci prepare --host-root "$PWD" --work "$RUNNER_TEMP/int05/prepare" --python-version 3.13
    - name: Restore once through the stock owner
      run: |
        INT05_PYTHON="$(python -c 'import sys; print(sys.executable)')"
        PYTHONPATH="$PWD" "$INT05_PYTHON" "$GITHUB_WORKSPACE/workflow-owner/scripts/int05_monitor_stock_command.py" --output "$RUNNER_TEMP/int05/restore-resource" --cwd "$PWD" --minimum-free-bytes "$INT05_DISK_FLOOR" --required-headroom-bytes 1342177280 --deadline-epoch "$INT05_WORK_DEADLINE_EPOCH" -- "$INT05_PYTHON" -m openpine.verification test-ci owner-environment --bundle "$RUNNER_TEMP/int05/prepare/bundle" --work "$RUNNER_TEMP/int05/restored"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      timeout-minutes: 5
      with:
        node-version: '24'
    - name: Prepare existing frontend owner launch locations
      working-directory: candidate/openpine-ui
      run: |
        INT05_PYTHON="$(python -c 'import sys; print(sys.executable)')"
        INT05_NPM="$(command -v npm)"
        INT05_NPX="$(command -v npx)"
        PYTHONPATH="$GITHUB_WORKSPACE/candidate" "$INT05_PYTHON" "$GITHUB_WORKSPACE/workflow-owner/scripts/int05_monitor_stock_command.py" --output "$RUNNER_TEMP/int05/npm-resource" --cwd "$PWD" --minimum-free-bytes "$INT05_DISK_FLOOR" --required-headroom-bytes 536870912 --deadline-epoch "$INT05_WORK_DEADLINE_EPOCH" -- "$INT05_NPM" ci
        PYTHONPATH="$GITHUB_WORKSPACE/candidate" "$INT05_PYTHON" "$GITHUB_WORKSPACE/workflow-owner/scripts/int05_monitor_stock_command.py" --output "$RUNNER_TEMP/int05/browser-resource" --cwd "$PWD" --minimum-free-bytes "$INT05_DISK_FLOOR" --required-headroom-bytes 1073741824 --deadline-epoch "$INT05_WORK_DEADLINE_EPOCH" -- "$INT05_NPX" playwright install --with-deps chromium
        node -e 'console.log("INT05_CHROMIUM="+require("@playwright/test").chromium.executablePath())' >> "$GITHUB_ENV"
    - name: Refreeze new hosted identities and complete full obligations
      run: |
        "$RUNNER_TEMP/int05/restored/venv/bin/python" -I "$GITHUB_WORKSPACE/workflow-owner/scripts/int05_monitor_stock_command.py" --output "$RUNNER_TEMP/int05/freeze-resource" --cwd "$PWD" --minimum-free-bytes "$INT05_DISK_FLOOR" --required-headroom-bytes 67108864 --deadline-epoch "$INT05_WORK_DEADLINE_EPOCH" -- "$RUNNER_TEMP/int05/restored/venv/bin/python" -I "$GITHUB_WORKSPACE/workflow-owner/scripts/int05_hosted_control.py" freeze
    - name: Run exactly one complete control pytest campaign
      run: |
        "$RUNNER_TEMP/int05/restored/venv/bin/python" -I "$GITHUB_WORKSPACE/workflow-owner/scripts/int05_monitor_stock_command.py" --output "$RUNNER_TEMP/int05/control-resource" --cwd "$PWD" --minimum-free-bytes "$INT05_DISK_FLOOR" --required-headroom-bytes 2147483648 --deadline-epoch "$INT05_WORK_DEADLINE_EPOCH" -- "$RUNNER_TEMP/int05/restored/venv/bin/python" -I "$GITHUB_WORKSPACE/workflow-owner/scripts/int05_hosted_control.py" control
    - name: Preserve all available primaries and audit public transport
      id: evidence
      if: always()
      run: |
        INT05_PYTHON="$(python -c 'import sys; print(sys.executable)')"
        PYTHONPATH="$PWD" "$INT05_PYTHON" "$GITHUB_WORKSPACE/workflow-owner/scripts/int05_monitor_stock_command.py" --output "$RUNNER_TEMP/int05/retention-resource" --cwd "$PWD" --minimum-free-bytes "$INT05_DISK_FLOOR" --required-headroom-bytes "$((ARTIFACT_BUDGET * 2 + 16777216))" --deadline-epoch "$INT05_RETENTION_DEADLINE_EPOCH" -- "$INT05_PYTHON" "$GITHUB_WORKSPACE/workflow-owner/scripts/int05_hosted_control.py" retain
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() && steps.evidence.outputs.public_ready == 'true' }}
      with:
        name: int05-control-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/int05/archive/
          ${{ runner.temp }}/int05/public-evidence-audit.json
        retention-days: '1'
        compression-level: 0
        if-no-files-found: error
