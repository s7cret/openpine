# Bounded preparation evidence only; full owner qualification remains separate.
name: RC6 preparation baseline
'on':
  push:
    branches: ['preparation/rc6-cpython313-20261006', 'execution/run04-int04-int05-20261007', 'execution/run04-int04-int05-retry-20261007']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Separate preparation or reviewed INT04/INT05 protected checks'
        type: choice
        options: [preparation, int04-int05-protected]
        default: preparation
      approved_candidate_sha:
        description: 'Exact action-time approved workflow and candidate commit'
        type: string
        default: ''
      qualification_security_approved:
        description: 'Approve listed ephemeral VM AppArmor/user provisioning and exact UUID unit actions'
        type: boolean
        default: false
      qualification_public_approved:
        description: 'Approve the new closed public projection in public s7cret/openpine, 64 MiB, 1 day'
        type: boolean
        default: false
      qualification_raw_retention:
        description: 'Private primaries stay on the ephemeral VM; this does not close durable archive qualification'
        type: choice
        options: [hold, ephemeral-acknowledged]
        default: hold
      public_evidence_approved:
        description: 'Run only after approval of the public evidence allowlist and storage route'
        type: boolean
        required: true
        default: true
      artifact_budget_bytes:
        description: 'Approved complete upload ceiling; 0 prevents the baseline run'
        required: true
        default: '134217728'
      retention_days:
        description: 'Approved evidence retention: exactly 1 day'
        required: true
        default: '1'
permissions:
  contents: read
concurrency:
  group: rc6-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  baseline:
    # Preparation branch pushes are approved within the recorded cumulative $0.10 budget.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/preparation/rc6-cpython313-20261006') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'preparation' && inputs.public_evidence_approved && inputs.artifact_budget_bytes != '0') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      ARTIFACT_BUDGET: ${{ inputs.artifact_budget_bytes || '134217728' }}
      RETENTION_DAYS: ${{ inputs.retention_days || '1' }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13.5'
    - name: Verify interpreter and bounded runner capacity
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/preparation-raw"
        python - <<'PY'
        import json, os, pathlib, platform, shutil, sys, sysconfig
        from openpine.verification.execution_identity import environment_snapshot, validate_python_support
        root=pathlib.Path(os.environ['RUNNER_TEMP'])
        identity=environment_snapshot()
        validate_python_support(json.loads(pathlib.Path('verification/execution-policy.json').read_text()), identity)
        assert sys.version_info[:3] == (3,13,5)
        assert platform.freedesktop_os_release()['VERSION_ID']=='24.04'
        assert shutil.disk_usage(root).free >= 8*1024**3
        assert 0 < int(os.environ['ARTIFACT_BUDGET']) <= 128*1024**2
        assert int(os.environ['RETENTION_DAYS']) == 1
        report={'environment':identity,'cpu_count':os.cpu_count(),'disk':dict(zip(('total','used','free'),shutil.disk_usage(root))), 'artifact_budget_bytes':int(os.environ['ARTIFACT_BUDGET']), 'scope':'preparation, not full product qualification'}
        (root/'preparation-raw/runner.json').write_text(json.dumps(report,indent=2))
        print(json.dumps(report))
        PY
    - name: Bootstrap hashed owner dependencies
      run: |
        python -m pip install --require-hashes --only-binary=:all: -r verification/ci-bootstrap-requirements.txt -r verification/ci-runtime-requirements.txt
    - name: Provision existing protected worker prerequisites
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y apparmor-profiles apparmor-utils bubblewrap
        sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
        sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
        if ! getent passwd openpine-worker >/dev/null; then
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin openpine-worker
        fi
        sudo -n -u openpine-worker -- /usr/bin/id -u
        /usr/bin/bwrap --ro-bind / / --unshare-net -- /usr/bin/true
    - name: Prepare clean exact eight-package wheels and complete collections
      id: prepared
      run: python -m openpine.verification test-ci prepare --host-root "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/preparation-work" --python-version 3.13
    - name: Run affected preparation regressions and one existing real worker obligation
      if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
      id: smoke
      env:
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      run: |
        "$RUNNER_TEMP/preparation-work/venv/bin/python" -m pytest --noconftest -q rc6_tests/test_rc6_python_support.py rc6_tests/test_rc6_clean_build.py rc6_tests/test_rc6_evidence_archive.py rc6_tests/test_rc6_public_evidence.py rc6_tests/test_rc6_private_retention.py rc6_tests/test_rc6_execution_ci.py rc6_tests/test_rc6_reconciliation_inventory.py 'rc6_tests/test_rc6_chart_metadata.py::test_real_worker_hourly_metadata[interactive]' --junitxml="$RUNNER_TEMP/preparation-raw/junit.xml"
    - name: Seal available raw evidence and report exact outcome
      id: evidence
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY'
        import json,os,pathlib,shutil,subprocess
        root=pathlib.Path(os.environ['RUNNER_TEMP']); raw=root/'preparation-raw';raw.mkdir(exist_ok=True)
        work=root/'preparation-work'
        if (work/'commands').exists():shutil.copytree(work/'commands',raw/'commands')
        for name in ('bundle.json','collection.json','installed-origins.json','package-trees.json','installed-package-trees.json'):
          if (work/'bundle'/name).is_file():shutil.copy2(work/'bundle'/name,raw/name)
        if (work/'bundle/collection.evidence').is_dir():shutil.copytree(work/'bundle/collection.evidence',raw/'collection.evidence',ignore=shutil.ignore_patterns('private'))
        report={'commit':os.environ['GITHUB_SHA'],'run_id':'rc6-preparation-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'],'scope':'bounded preparation baseline','full_product_qualified':False}
        (raw/'summary.json').write_text(json.dumps(report,indent=2))
        (raw/'transport-scope.json').write_text(json.dumps({'scope':'preparation primary logs, collection receipts, JUnit and byte identities','excluded':'source archives, wheel build inputs, virtualenvs, caches, private temporary trees; these are not published','full_product_qualified':False},indent=2))
        subprocess.run(['python','-m','scripts.rc6_public_evidence','--root',str(raw),'--candidate',report['commit'],'--run-id',report['run_id'],'--max-bytes',str(128*1024**2),'--output',str(root/'public-evidence-audit.json')],check=True)
        args=['python','-m','openpine.verification.execution_evidence','archive','--evidence',str(raw),'--output',str(root/'preparation-archive'),'--source-root',os.environ['GITHUB_WORKSPACE'],'--candidate',report['commit'],'--run-id',report['run_id'],'--retention-days',os.environ['RETENTION_DAYS'],'--max-bytes',str(128*1024**2)]
        for source in (work/'stack').glob('*'):
          if source.is_dir():args.extend(['--source-root',str(source)])
        subprocess.run(args,check=True)
        manifest=json.loads((root/'preparation-archive/manifest.json').read_text())
        subprocess.run(['python','-m','openpine.verification.execution_evidence','verify','--archive',str(root/'preparation-archive/evidence.tar.gz'),'--manifest',str(root/'preparation-archive/manifest.json'),'--expected-manifest-hash',manifest['content_hash'],'--candidate',report['commit'],'--run-id',report['run_id']],check=True)
        print(json.dumps(manifest,indent=2))
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:
          f.write('manifest_hash='+manifest['content_hash']+'\n')
          f.write('archive_hash='+manifest['archive']['sha256']+'\n')
          f.write('archive_bytes='+str(manifest['archive']['size'])+'\n')
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('Preparation evidence manifest: `'+manifest['content_hash']+'`\n\n'+json.dumps(report)+'\n\nPublic evidence: complete upload capped at 128 MiB, retention 1 day, recorded cumulative storage budget $0.10.\n')
        if int(os.environ['ARTIFACT_BUDGET']):
          from scripts.rc6_public_evidence import check_upload_payload
          payload=check_upload_payload(root/'preparation-archive',root/'public-evidence-audit.json',max_bytes=int(os.environ['ARTIFACT_BUDGET']))
          print('Complete public upload budget:',json.dumps(payload))
        print('Public byte audit:', (root/'public-evidence-audit.json').read_text())
        PY
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() && steps.evidence.outcome == 'success' && env.ARTIFACT_BUDGET != '0' }}
      with:
        name: rc6-preparation-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/preparation-archive/
          ${{ runner.temp }}/public-evidence-audit.json
        retention-days: ${{ env.RETENTION_DAYS }}
        compression-level: 0
        if-no-files-found: error

  protected-qualification:
    # Creating the dedicated execution ref is an action-time approved launch,
    # separate from pushing this implementation branch or any ordinary PR.
    if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/execution/run04-int04-int05-20261007' || github.ref == 'refs/heads/execution/run04-int04-int05-retry-20261007')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'int04-int05-protected' && inputs.qualification_security_approved && inputs.approved_candidate_sha != '' && inputs.qualification_raw_retention == 'ephemeral-acknowledged') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APPROVED_SHA: ${{ inputs.approved_candidate_sha || github.sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      QUALIFICATION_PUBLIC: ${{ github.event_name == 'push' || inputs.qualification_public_approved }}
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ inputs.approved_candidate_sha || github.sha }}
    - name: Refuse workflow or source drift before provisioning
      id: identity
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_SHA" = "$APPROVED_SHA"
        test "$WORKFLOW_SHA" = "$APPROVED_SHA"
        test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13.5'
        cache: ''
    - name: Verify approved capacity before provisioning
      run: |
        python -B - <<'PY'
        import os, platform, shutil, sys
        assert sys.version_info[:3] == (3, 13, 5) and sys._is_gil_enabled()
        assert platform.freedesktop_os_release()['VERSION_ID'] == '24.04'
        assert 0 < len(os.sched_getaffinity(0)) <= 4
        assert os.sysconf('SC_PHYS_PAGES') * os.sysconf('SC_PAGE_SIZE') <= 16 * 1024**3
        assert shutil.disk_usage(os.environ['RUNNER_TEMP']).free >= 3000000000
        PY
    - name: Install only hashed driver dependencies
      run: |
        python -m pip install --require-hashes --only-binary=:all: -r verification/ci-bootstrap-requirements.txt -r verification/ci-runtime-requirements.txt
    - name: Approved ephemeral protected worker provisioning
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y apparmor-profiles apparmor-utils bubblewrap
        sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
        sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
        if ! getent passwd openpine-worker >/dev/null; then
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin openpine-worker
        fi
        sudo -n -u openpine-worker -- /usr/bin/id -u
        /usr/bin/bwrap --ro-bind / / --unshare-net -- /usr/bin/true
    - name: Run the exact installed A/B owners and actual protected fault matrix
      id: qualification
      shell: bash
      run: |
        set -euo pipefail
        args=()
        if test "$QUALIFICATION_PUBLIC" = 'true'; then args+=(--public-approved); fi
        # Driver details and raw failure traces stay on the private ephemeral VM.
        private_log="$RUNNER_TEMP/run04-qualified-driver.log"
        install -m 0600 /dev/null "$private_log"
        if python -B -m openpine.verification.qualification_hosted run --host "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/run04-qualified" --approved-sha "$APPROVED_SHA" "${args[@]}" >"$private_log" 2>&1; then
          echo 'Protected checks completed; durable raw retention remains open.'
        else
          echo 'Protected checks failed; private primaries retained only on this ephemeral VM.'
          exit 1
        fi
    - name: Validate or recover a closed public outcome before upload
      id: public_outcome
      if: ${{ always() && steps.identity.outcome == 'success' && env.QUALIFICATION_PUBLIC == 'true' }}
      env:
        DRIVER_OUTCOME: ${{ steps.qualification.outcome }}
      run: |
        python -B -m openpine.verification.qualification_public --host "$GITHUB_WORKSPACE" --folder "$RUNNER_TEMP/run04-qualified/public" --candidate-sha "$APPROVED_SHA" --driver-outcome "$DRIVER_OUTCOME"
    - name: Upload only the new closed public projection
      if: ${{ always() && steps.public_outcome.outcome == 'success' && env.QUALIFICATION_PUBLIC == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: run04-protected-public-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/run04-qualified/public/projection.json
          ${{ runner.temp }}/run04-qualified/public/projection.sha256
        compression-level: 0
        include-hidden-files: false
        if-no-files-found: error
        retention-days: 1
