[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openpine"
version = "5.0.0rc4"
description = "OpenPine product orchestration boundary for the Pine stack"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "msgpack>=1.0,<2",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
    "fastapi>=0.115.0,<0.137",
    "starlette>=1.3.1,<1.7",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "pine2ast==5.0.0rc4",
    "ast2python==5.0.0rc4",
    "pinelib==5.0.0rc4",
    "backtest-engine==5.0.0rc4",
    "marketdata-provider==5.0.0rc4",
    "optimizer==5.0.0rc4",
    "openpine-contracts==5.0.0rc4",
]

[project.urls]
Homepage = "https://github.com/s7cret/openpine"
Repository = "https://github.com/s7cret/openpine"
Issues = "https://github.com/s7cret/openpine/issues"
Documentation = "https://github.com/s7cret/openpine#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.28.0",
    "pytest-asyncio>=1.4.0",
    "matplotlib>=3.8.0",
    "build>=1.2.0",
]

[project.scripts]
openpine = "openpine.cli.main:main"

[tool.setuptools.packages.find]
include = ["openpine*"]
exclude = ["openpine-ui*"]

[tool.setuptools.package-data]
openpine = ["py.typed", "stack-lock.json", "storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The release gate enforces undefined-name/import checks plus the reviewed
# exception-containment, FastAPI-default, and subprocess security policies.
select = ["E4", "E7", "E9", "F", "BLE001", "S110", "S112", "B008", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.ruff.lint.per-file-ignores]
# FastAPI evaluates Depends(...) in parameter defaults by design. Route
# handlers also contain and translate provider/storage failures at the API
# boundary; selected best-effort fallbacks intentionally continue or pass.
"openpine/gateway/routes/*.py" = ["B008", "BLE001", "S110", "S112"]
# Command handlers are the top-level user boundary and must turn arbitrary
# adapter/provider failures into deterministic exit codes and diagnostics.
"openpine/cli/data.py" = ["BLE001"]
"openpine/cli/main.py" = ["BLE001", "E402", "F401", "S603"]
"openpine/cli/runtime_helpers.py" = ["BLE001"]
# Process-supervision boundaries must contain arbitrary worker/plugin failures.
"openpine/gateway/live_runner.py" = ["BLE001", "S110"]
"openpine/gateway/worker_supervisor.py" = ["BLE001", "S110"]
"openpine/workers/strategy_job_executor.py" = ["BLE001"]
"openpine/batch/runner.py" = ["BLE001", "S603"]
"openpine/compile/adapter.py" = ["BLE001", "S603"]
"openpine/daemon/service.py" = ["BLE001"]
# Gateway lifecycle, websocket, and dependency adapters isolate client,
# optional dependency, and shutdown failures from the serving process.
"openpine/gateway/deps.py" = ["BLE001"]
"openpine/gateway/server.py" = ["BLE001", "S110"]
"openpine/gateway/ws_manager.py" = ["BLE001"]
# Network/exchange/notification boundaries normalize third-party failures.
"openpine/execution/*.py" = ["BLE001"]
"openpine/notifications/telegram.py" = ["BLE001", "E402", "S603"]
"openpine/data/periodic_fetcher.py" = ["BLE001"]
"openpine/optimizer/adapter.py" = ["BLE001"]
# Storage/cache/recovery boundaries preserve fail-closed state while reporting
# corrupt, legacy, or unavailable backends.
"openpine/storage/*.py" = ["BLE001", "S112"]
"openpine/state/store.py" = ["BLE001"]
"openpine/recovery/rebuild.py" = ["BLE001"]
"openpine/data/orchestrator.py" = ["BLE001"]
"openpine/data/persistent_cache.py" = ["BLE001"]
"openpine/_compat/parquet.py" = ["BLE001"]
# User extension/subscriber/optional-integration boundaries isolate one bad
# callback or optional package from unrelated work.
"openpine/achievements/engine.py" = ["BLE001"]
"openpine/events/bus.py" = ["BLE001"]
"openpine/integrations.py" = ["BLE001"]
# Timezone parsing converts arbitrary zone-provider errors to validation errors.
"openpine/timezones.py" = ["BLE001"]
# These subprocess boundaries use fixed executables or validated argv lists;
# callers inspect return codes and never invoke a shell.
"openpine/cli/ops.py" = ["S603", "S607"]
"openpine/distribution.py" = ["S603", "S607"]
"openpine/gateway/routes/accounts_data.py" = ["B008", "BLE001", "S110", "S112", "S603"]
"openpine/stack_lock.py" = ["S603", "S607"]
"scripts/soak_monitor.py" = ["S603", "S607"]

[tool.coverage.run]
source = ["openpine"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
