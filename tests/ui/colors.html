<!doctype html><html lang="ru"><meta charset="utf-8"><title>Color plot qualification</title>
<style>body{background:#121821;color:#dce4ef;font:16px system-ui}canvas{border:1px solid #485463;margin:10px}</style>
<h1>Color plot qualification</h1><pre id="colors-results">Running</pre>
<canvas id="plot" width="800" height="220"></canvas>
<script src="/apps/ui/static/plots.js"></script>
<script>
(() => {
    const errors=[], check=(ok,message)=>{if(!ok)errors.push(message);};
    const canvas=document.getElementById("plot"), ctx=canvas.getContext("2d");
    const x=i=>20+i*140,y=v=>200-v*4;
    const base={values:[10,20,30,40],colors:["#00FF00FF","#00FF00FF","#FF0000FF","#FF0000FF"],linewidth:3,style:"line"};
    drawPinePlot(ctx,base,0,4,x,y);
    const green=ctx.getImageData(x(1),y(20),1,1).data, red=ctx.getImageData(x(2),y(30),1,1).data;
    check(green[1]>200&&green[0]<30,"Second point must be green");
    check(red[0]>200&&red[1]<30,"Third point must be red");
    ctx.clearRect(0,0,800,220);
    drawPinePlot(ctx,{...base,colors:[null,null,null,null]},0,4,x,y);
    check(ctx.getImageData(0,0,800,220).data.every(v=>v===0),"Missing color must hide every point");
    drawPinePlot(ctx,{...base,colors:["#FF000000","#FF000000","#FF000000","#FF000000"]},0,4,x,y);
    check(ctx.getImageData(0,0,800,220).data.every(v=>v===0),"Alpha zero must hide every point");
    for(const style of ["line","linebr","stepline","histogram","columns","circles","cross","area"])
        drawPinePlot(ctx,{...base,style},0,4,x,y);
    ctx.clearRect(0,0,800,220);drawPinePlot(ctx,base,1,3,x,y);
    check(ctx.getImageData(x(0),y(10),1,1).data[3]===0,"Range must not draw an excluded point");
    document.getElementById("colors-results").textContent=errors.length?"FAIL: "+errors.join("; "):"PASS: colors, transparency, missing color, styles, range";
    document.body.dataset.result=errors.length?"failed":"passed";
})();
</script>
