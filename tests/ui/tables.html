<!doctype html><html lang="en"><meta charset="utf-8"><title>Pine pane tables</title>
<link rel="stylesheet" href="/apps/ui/static/style.css">
<style>.chart-pane{width:500px}.chart-pane canvas{height:160px}</style>
<pre id="results">Running</pre>
<div id="empty-chart"></div><h1 id="chart-title"></h1><p id="chart-subtitle"></p>
<div id="charts">
  <div class="chart-pane price-pane"><canvas id="price-chart"></canvas><div class="pine-tables" id="price-tables"></div></div>
  <div class="chart-pane output-pane"><canvas id="output-chart"></canvas><div class="pine-tables" id="output-tables"></div></div>
  <div id="tooltip" hidden></div>
</div>
<table><tbody id="outputs"></tbody></table><div id="identity"><span id="identity-text"></span></div>
<button id="download-result"></button><button id="reset-view"></button><div id="legend"></div>
<div class="chart-pane live-price-pane"><canvas id="live-price-chart"></canvas><div class="pine-tables" id="live-price-tables"></div></div>
<div class="chart-pane live-output-pane"><canvas id="live-output-chart"></canvas><div class="pine-tables" id="live-output-tables"></div></div>
<div id="live-legend"></div>
<script src="/apps/ui/static/plots.js"></script>
<script>
(async () => {
  const byId = id => document.getElementById(id);
  const check = (test, message) => { if (!test) throw new Error(message); };
  const record = text => ({id: 1, position: "top_right", rows: 2, columns: 2, bgcolor: "#12345680", cells: [
    {column: 1, row: 0, text, bgcolor: "#228844FF", text_color: "#FFFFFFFF"}
  ]});
  const current = id => byId(id).querySelector("table");
  const textAt = id => current(id)?.textContent;
  const results = [];
  const layer = byId("price-tables");
  const near = (a, b) => Math.abs(a - b) <= 1;
  for (const y of ["top", "middle", "bottom"]) {
    for (const x of ["left", "center", "right"]) {
      const position = y + "_" + x;
      renderPineTables(layer, [{...record("<b>literal</b>"), position}]);
      const table = current("price-tables");
      const a = table.getBoundingClientRect(), b = layer.getBoundingClientRect();
      check(near(a.left + a.width * (x === "left" ? 0 : x === "right" ? 1 : .5),
        b.left + b.width * (x === "left" ? 0 : x === "right" ? 1 : .5)), "horizontal anchor " + position);
      check(near(a.top + a.height * (y === "top" ? 0 : y === "bottom" ? 1 : .5),
        b.top + b.height * (y === "top" ? 0 : y === "bottom" ? 1 : .5)), "vertical anchor " + position);
      check(!table.querySelector("b") && table.textContent === "<b>literal</b>", "plain text");
      check(table.rows.length === 1 && table.rows[0].cells.length === 1, "sparse cells");
    }
  }
  check(getComputedStyle(layer).pointerEvents === "none", "overlay must pass pointer events through");
  results.push("9 anchors, escaped text and sparse grid");
  const app = await (await fetch("/apps/ui/static/app.js")).text();
  const appBlock = app.slice(app.indexOf("function renderResult("), app.indexOf("async function history("));
  const historical = new Function("$", "status", "clearError", "renderProtection", "protectionSeries",
    "drawProtectionFills", "number", `let result,chartData,resultJob,view,visible;const colors=[];
    ${appBlock}
    return {renderResult, range: () => view};`)(byId, () => {}, () => {}, () => {}, () => [], () => {}, String);
  const bars = Array.from({length: 12}, (_, i) => ({close: i + 1, time: i * 60000}));
  const response = (overlay, tables=[record("confirmed")]) => ({status: "executed", result: {observation_count: bars.length, outputs: [],
    identity: {language_version: 6}, declaration: {overlay}, data: {}, tables}});
  historical.renderResult(response(true), {data: {bars}}, "a");
  check(textAt("price-tables") === "confirmed" && !current("output-tables"), "historical price panel");
  const canvas = byId("price-chart");
  const before = current("price-tables");
  const location = before.getBoundingClientRect().toJSON();
  canvas.dispatchEvent(new WheelEvent("wheel", {deltaY: -100}));
  canvas.setPointerCapture = () => {};
  canvas.dispatchEvent(new PointerEvent("pointerdown", {clientX: 230}));
  canvas.dispatchEvent(new PointerEvent("pointermove", {clientX: 280}));
  canvas.dispatchEvent(new PointerEvent("pointerup"));
  canvas.dispatchEvent(new PointerEvent("pointermove", {clientX: 20}));
  check(historical.range()[1] - historical.range()[0] < bars.length, "zoom actually changed the range");
  check(current("price-tables") === before && before.textContent === "confirmed" &&
    JSON.stringify(before.getBoundingClientRect().toJSON()) === JSON.stringify(location), "zoom, pan and hover");
  historical.renderResult(response(false), {start: 100, data: {bars}}, "a");
  check(!current("price-tables") && textAt("output-tables") === "confirmed", "historical indicator panel");
  const forced = text => ({...record(text), id: 2, force_overlay: true});
  const ordinary = {...record("ordinary"), position: "bottom_left"};
  historical.renderResult(response(false, [ordinary, forced("forced")]), {data: {bars}}, "a");
  check(textAt("price-tables") === "forced" && textAt("output-tables") === "ordinary", "historical mixed panes");
  historical.renderResult(response(true, [ordinary, forced("forced")]), {data: {bars}}, "a");
  check(byId("price-tables").querySelectorAll("table").length === 2 && !current("output-tables"), "historical inherited price pane");
  results.push("historical pane, zoom, pan and hover");

  const market = await (await fetch("/apps/ui/static/market.js")).text();
  const liveBlock = market.slice(market.indexOf("function liveCanvas("), market.indexOf('\n$("live-start")'));
  const live = new Function("liveWindow", "liveState", "liveFollow", "liveStart", "colors", "$",
    liveBlock + ";drawLive();");
  const window = {bars: bars.slice(0, 2), rows: [], outputs: [], tables: [record("confirmed")], table_overlay: true,
    preview: {time: bars[2].time, outputs: [], tables: [record("preview")]}};
  const state = {preview_candle: {...bars[2], open_time: bars[2].time, closed: false}};
  live(window, state, true, 0, ["blue"], byId);
  check(textAt("live-price-tables") === "preview" && !current("live-output-tables"), "live preview");
  live({...window, table_overlay: false}, state, false, 0, ["blue"], byId);
  check(textAt("live-output-tables") === "confirmed" && !current("live-price-tables"), "live confirmed");
  const mixed = {...window, table_overlay: false, tables: [ordinary, record("confirmed")],
    preview: {...window.preview, tables: [ordinary, forced("forced preview")]}};
  live(mixed, state, true, 0, ["blue"], byId);
  check(textAt("live-price-tables") === "forced preview" && textAt("live-output-tables") === "ordinary", "live mixed preview");
  live(mixed, state, false, 0, ["blue"], byId);
  check(!current("live-price-tables") && byId("live-output-tables").querySelectorAll("table").length === 2, "live preview rollback");
  live({...window, tables: []}, state, false, 0, ["blue"], byId);
  check(!current("live-price-tables") && !current("live-output-tables"), "deleted table clears display");
  results.push("live preview, confirmed state and deletion");
  const corpus = await (await fetch("/conformance/tables/cases.json")).json();
  const equity = corpus.cases.find(item => item.case_id === "v6-strategy-equity").expected;
  const strategy = response(false, equity.tables);
  strategy.result.simulation = {statistics: equity.simulation_statistics};
  historical.renderResult(strategy, {data: {bars}}, "strategy");
  check(textAt("output-tables") === equity.simulation_statistics.equity && !current("price-tables"),
    "historical strategy equity table");
  const [confirmedEquity] = equity.tables;
  const previewEquity = {...confirmedEquity, cells: [{...confirmedEquity.cells[0], text: "1020.5"}]};
  const strategyWindow = {...window, table_overlay: false, tables: equity.tables,
    preview: {...window.preview, tables: [previewEquity]}};
  const strategyState = {...state, simulation: strategy.result.simulation};
  live(strategyWindow, strategyState, true, 0, ["blue"], byId);
  check(textAt("live-output-tables") === "1020.5", "strategy equity preview");
  live(strategyWindow, strategyState, false, 0, ["blue"], byId);
  check(textAt("live-output-tables") === equity.simulation_statistics.equity, "strategy equity confirmed");
  results.push("strategy equity on historical and live charts");
  const styled = corpus.cases.find(item => item.case_id === "v6-style").expected.tables[0];
  const moved = {...styled, position: "top_right", frame_width: 2, frame_color: "#AA2200FF",
    cells: [{...styled.cells[0], text: "preview", text_color: "#FFFFFFFF", bgcolor: "#12345680"}, ...styled.cells.slice(1)]};
  const checkStyle = (id, record, frameColor, frameWidth, text, textColor) => {
    const table = current(id);
    check(table.dataset.position === record.position, id + " styled anchor");
    const frame = getComputedStyle(table);
    check(frame.borderCollapse === "separate" && frame.borderSpacing === "0px" &&
      frame.backgroundColor === "rgb(17, 34, 51)", id + " background and border model");
    check(frame.borderTopColor === frameColor && frame.borderTopWidth === frameWidth &&
      frame.borderRightWidth === frameWidth && frame.borderBottomWidth === frameWidth &&
      frame.borderLeftWidth === frameWidth, id + " outer frame");
    const [first, second] = table.rows[0].cells;
    const grid = getComputedStyle(second);
    const below = getComputedStyle(table.rows[1].cells[0]);
    const cell = getComputedStyle(first);
    check(first.textContent === text && cell.color === textColor &&
      cell.borderTopWidth === "0px" && cell.borderLeftWidth === "0px", id + " isolated text");
    check(grid.borderLeftWidth === "3px" && grid.borderLeftColor === "rgb(85, 119, 153)" &&
      grid.borderRightWidth === "0px" && grid.backgroundColor === "rgb(52, 86, 120)" &&
      below.borderTopWidth === "3px" && below.borderTopColor === "rgb(85, 119, 153)", id + " internal grid");
  };
  historical.renderResult(response(false, [styled, {...ordinary, position: "top_left"}]), {data: {bars}}, "b");
  checkStyle("price-tables", styled, "rgb(170, 204, 238)", "4px", "reset", "rgb(54, 58, 69)");
  check(textAt("output-tables") === "ordinary", "historical styled overlay");
  const styledWindow = {...window, table_overlay: false, tables: [styled],
    preview: {...window.preview, tables: [moved]}};
  live(styledWindow, state, true, 0, ["blue"], byId);
  checkStyle("live-price-tables", moved, "rgb(170, 34, 0)", "2px", "preview", "rgb(255, 255, 255)");
  check(getComputedStyle(current("live-price-tables").rows[0].cells[0]).backgroundColor ===
    "rgba(18, 52, 86, 0.5)" && !current("live-output-tables"), "preview cell alpha and overlay");
  live(styledWindow, state, false, 0, ["blue"], byId);
  checkStyle("live-price-tables", styled, "rgb(170, 204, 238)", "4px", "reset", "rgb(54, 58, 69)");
  results.push("outer frame, inner grid, cell colors and preview relocation");
  const layout = corpus.cases.find(item => item.case_id === "v6-cell-layout").expected.tables[0];
  const previewLayout = {...layout, cells: layout.cells.map((cell, i) => i ? cell :
    {...cell, width: 40.25, text: "Preview", tooltip: "Preview tip"})};
  const checkLayout = (id, width, text) => {
    const table = current(id);
    const layerBounds = byId(id).getBoundingClientRect();
    const cell = table.rows[0].cells[0];
    const bounds = cell.getBoundingClientRect();
    const css = getComputedStyle(cell);
    check(near(bounds.width, layerBounds.width * width) && near(bounds.height, layerBounds.height * .25),
      id + " explicit track sizes");
    check(near(table.rows[1].cells[0].getBoundingClientRect().height, layerBounds.height * .3), id + " row maximum");
    check(near(table.rows[1].cells[0].getBoundingClientRect().width, bounds.width), id + " shared column");
    check(table.rows[0].cells[2].textContent === "reset" && table.rows[0].cells[2].getBoundingClientRect().width > 0,
      id + " automatic column");
    check(css.fontSize === "24px" && css.fontFamily === "monospace" && css.fontStyle === "italic" &&
      css.fontWeight === "700" && css.textAlign === "right" && css.justifyContent === "flex-end",
      id + " typography and alignment");
    check(css.overflow === "hidden" && table.rows[1].cells[0].style.textAlign === "center" &&
      cell.textContent === text, id + " text and cell clipping");
    return {clientX: bounds.left + bounds.width / 2, clientY: bounds.top + bounds.height / 2};
  };
  historical.renderResult(response(false, [layout]), {data: {bars}}, "c");
  const pointer = checkLayout("price-tables", .35, "Confirmed");
  check(!current("output-tables"), "layout respects force_overlay");
  check(document.elementFromPoint(pointer.clientX, pointer.clientY) === canvas, "table preserves canvas hit testing");
  canvas.dispatchEvent(new PointerEvent("pointermove", pointer));
  check(byId("tooltip").textContent === "<b>Confirmed</b>" && !byId("tooltip").querySelector("b"),
    "historical table tooltip is plain text");
  const rangeBefore = historical.range();
  canvas.dispatchEvent(new WheelEvent("wheel", {...pointer, deltaY: -120}));
  const rangeAfter = historical.range();
  check(rangeAfter[1] - rangeAfter[0] < rangeBefore[1] - rangeBefore[0], "wheel over the cell zooms chart");
  canvas.dispatchEvent(new PointerEvent("pointerdown", pointer));
  canvas.dispatchEvent(new PointerEvent("pointermove", {...pointer, clientX: pointer.clientX - 80}));
  canvas.dispatchEvent(new PointerEvent("pointerup", pointer));
  check(historical.range()[0] !== rangeAfter[0], "drag starting over the cell pans chart");

  const liveCanvas = byId("live-price-chart");
  const liveTip = document.createElement("div");
  bindPineLabelHover(liveCanvas, liveTip);
  const layoutWindow = {...window, table_overlay: false, tables: [layout],
    preview: {...window.preview, tables: [previewLayout]}};
  live(layoutWindow, state, true, 0, ["blue"], byId);
  const livePointer = checkLayout("live-price-tables", .4025, "Preview");
  liveCanvas.dispatchEvent(new PointerEvent("pointermove", livePointer));
  check(liveTip.textContent === "Preview tip", "live preview tooltip");
  live(layoutWindow, state, false, 0, ["blue"], byId);
  checkLayout("live-price-tables", .35, "Confirmed");
  check(liveTip.textContent === "<b>Confirmed</b>", "live rollback refreshes the hovered cell");
  live({...layoutWindow, tables: []}, state, false, 0, ["blue"], byId);
  check(liveTip.hidden, "live table removal clears tooltip");
  const outputLayout = {...layout, force_overlay: false};
  historical.renderResult(response(false, [outputLayout]), {data: {bars}}, "d");
  checkLayout("output-tables", .35, "Confirmed");
  results.push("pane percentages, typography, transparent hover and replay rollback");
  const mergeCase = name => corpus.cases.find(item => item.case_id === name).expected.tables;
  const [merged] = mergeCase("v6-merge"), [cleared] = mergeCase("v6-merge-clear");
  const checkMerged = (id, text) => {
    const table = current(id), anchor = table.rows[0].cells[0];
    const bounds = anchor.getBoundingClientRect(), area = byId(id).getBoundingClientRect();
    check(anchor.textContent === text && anchor.rowSpan === 2 && anchor.colSpan === 2, id + " merged anchor");
    check(table.querySelectorAll("td").length === 6 && !table.textContent.includes("Hidden"), id + " hidden covered cells");
    check(near(bounds.width, area.width * .4) && near(bounds.height, area.height * .3), id + " neighboring track dimensions");
    check(getComputedStyle(anchor).borderTopWidth === "0px" && getComputedStyle(anchor).borderLeftWidth === "0px" &&
      getComputedStyle(table.rows[0].cells[1]).borderLeftWidth === "1px" &&
      getComputedStyle(table.rows[2].cells[0]).borderTopWidth === "1px", id + " border only at perimeter");
    return {clientX: bounds.right - 2, clientY: bounds.bottom - 2};
  };
  historical.renderResult(response(false, [merged]), {data: {bars}}, "e");
  const mergePointer = checkMerged("price-tables", "Restored");
  check(!current("output-tables"), "merged table respects force_overlay");
  canvas.dispatchEvent(new PointerEvent("pointermove", mergePointer));
  check(byId("tooltip").textContent === "<b>Merged</b>" && !byId("tooltip").querySelector("b"),
    "merged tooltip at far corner");
  historical.renderResult(response(false, [cleared]), {data: {bars}}, "f");
  const clearTable = current("price-tables");
  check(!clearTable.querySelector("[colspan],[rowspan]") && clearTable.textContent === "ABCDStatus",
    "cleared anchor and covered content stay hidden");

  const [whole] = mergeCase("v6-merge-after");
  renderPineTables(layer, [whole]);
  const entire = current("price-tables").rows[0].cells[0];
  check(entire.colSpan === 3 && entire.textContent === "Whole header" && entire.getBoundingClientRect().width > 40,
    "automatic sizing for an isolated sparse merged header");
  renderPineTables(layer, [{...whole, cells: [whole.cells[1]]}]);
  check(!current("price-tables"), "covered data alone does not make a table visible");

  const previewMerge = {...merged, merges: [...merged.merges,
    {start_column: 2, start_row: 0, end_column: 2, end_row: 1}]};
  const mergeWindow = {...window, table_overlay: false, tables: [merged],
    preview: {...window.preview, tables: [previewMerge]}};
  live(mergeWindow, state, true, 0, ["blue"], byId);
  const previewTable = current("live-price-tables");
  check(previewTable.rows[0].cells[1].rowSpan === 2 && previewTable.rows[1].cells.length === 0 &&
    !previewTable.textContent.includes("B"), "preview has a separate vertical merge");
  live(mergeWindow, state, false, 0, ["blue"], byId);
  const confirmedPointer = checkMerged("live-price-tables", "Restored");
  liveCanvas.dispatchEvent(new PointerEvent("pointermove", confirmedPointer));
  check(liveTip.textContent === "<b>Merged</b>", "replay merged tooltip");
  check(current("live-price-tables").rows[1].cells[0].textContent === "B", "preview merge rolls back");
  results.push("merged span, sparse tracks, tooltip, clear and replay rollback");
  byId("results").textContent = "PASS " + results.join(" / ");
  document.body.dataset.result = "passed";
})().catch(error => {
  document.getElementById("results").textContent = error.stack;
  document.body.dataset.result = "failed";
});
</script>
