<!doctype html><html lang="ru"><meta charset="utf-8"><title>Visual bands qualification</title>
<style>body{background:#121821;color:#dce4ef;font:16px system-ui}canvas{border:1px solid #485463;margin:10px}</style>
<h1>Visual bands qualification</h1><pre id="results">Running</pre><div class="source-card"></div><canvas id="plot" width="500" height="220"></canvas>
<script>const $=id=>document.getElementById(id);let busy=false,compiledRef='test';async function api(){return {presets:[]};}</script>
<script src="/apps/ui/static/parameters.js"></script><script src="/apps/ui/static/plots.js"></script>
<script>
(async()=>{
 const errors=[],check=(ok,s)=>{if(!ok)errors.push(s)},canvas=$('plot'),ctx=canvas.getContext('2d'),x=i=>20+i*100,y=v=>200-v*5;
 const a={output_id:'a',kind:'plot',values:[30,30,30,30],colors:Array(4).fill(null),hiddenLine:true};
 const b={...a,output_id:'b',values:[10,10,10,10]};
 const fill={kind:'fill',references:['a','b'],colors:Array(4).fill('#FF000080'),values:Array(4).fill(null),fillgaps:false};
 const pixel=(xx,yy)=>ctx.getImageData(xx,yy,1,1).data,clear=()=>ctx.clearRect(0,0,500,220);
 drawPineLayers(ctx,[a,b,fill],0,4,x,y);let p=pixel(70,100);check(p[0]>240&&p[1]<10&&p[3]>=127&&p[3]<=129,'RGBA fill between hidden endpoints');
 clear();drawPineLayers(ctx,[{...a,values:[30,null,30,30]},b,fill],0,4,x,y);check(pixel(70,100)[3]===0,'fillgaps=false must break');
 clear();drawPineLayers(ctx,[{...a,values:[30,null,30,30]},b,{...fill,fillgaps:true}],0,4,x,y);check(pixel(70,100)[3]>0,'fillgaps=true must bridge');
 clear();drawPineLayers(ctx,[a,b,{...fill,colors:Array(4).fill(null)}],0,4,x,y);check(pixel(70,100)[3]===0,'Missing fill color hides polygon');
 clear();drawPineLayers(ctx,[a,b,{...fill,colors:Array(4).fill('#FF000000')}],0,4,x,y);check(pixel(70,100)[3]===0,'Transparent fill hides polygon');
 clear();drawPineLayers(ctx,[a,b,fill],1,3,x,y);check(pixel(70,100)[3]===0&&pixel(170,100)[3]>0,'Range bounds');
 clear();drawPineLayers(ctx,[{...a,hiddenLine:false,kind:'hline',style:'dashed',linewidth:2,colors:Array(4).fill('#00FF00FF')}],0,4,x,y);
 check(pixel(22,50)[1]>200&&pixel(28,50)[3]===0,'Dashed hline has visible strokes and gaps');
 const d={input_id:'input:c',name:'c',title:'Color',input_type:'color',default:'#12345680',default_text:'#12345680',active:true,options:[],tooltip:''};
 await setInputSchema({sha256:'test',definitions:[d]});let c=$('parameter-c'),picker=inputPanel.querySelector('input[type=color]'),alpha=inputPanel.querySelector('input[type=range]');
 check(picker.value==='#123456'&&alpha.value==='128','Default picker RGBA');picker.value='#abcdef';alpha.value='64';alpha.dispatchEvent(new Event('input'));
 check(getInputOverrides()['input:c']==='#ABCDEF40','Picker + alpha payload');applyInputValues({'input:c':'#FFFFFF00'});check(alpha.value==='0'&&picker.value==='#ffffff','Preset sync');
 $('input-reset').click();check(c.value==='#12345680'&&alpha.value==='128','Reset RGBA');setInputLock(true);check(picker.disabled&&alpha.disabled&&c.disabled,'Job lock');setInputLock(false);
 c.value='#123456';check(getInputOverrides()['input:c']==='#123456FF','Six-digit normalization');c.value='red';let rejected=false;try{getInputOverrides()}catch(e){rejected=true}check(rejected,'Invalid color rejected');
 applyInputValues(null);clear();drawPineLayers(ctx,[a,b,fill],0,4,x,y);
 $('results').textContent=errors.length?'FAIL: '+errors.join('; '):'PASS: bands, gaps, alpha, levels, ranges, picker, preset, reset, lock';document.body.dataset.result=errors.length?'failed':'passed';
})().catch(e=>{$('results').textContent='FAIL: '+e.stack;document.body.dataset.result='failed'});
</script>
