<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Plot appearance</title>
<style>canvas{width:440px;height:220px}</style>
<h1>Plot appearance</h1><pre id="results">Running</pre>
<canvas id="geometry" width="440" height="220"></canvas>
<canvas id="price-chart"></canvas><canvas id="output-chart"></canvas>
<script src="/apps/ui/static/plots.js"></script>
<script>
(async () => {
  const byId=id=>document.getElementById(id);
  const check=(pass,message)=>{if(!pass)throw new Error(message);};
  const same=(actual,expected)=>check(JSON.stringify(actual)===JSON.stringify(expected),JSON.stringify({actual,expected}));
  const ctx=byId("geometry").getContext("2d"),x=i=>30+60*i,y=v=>175-2*v;
  const color="#123456FF",bounds={left:5,right:420,top:0,bottom:200};
  const alpha=(px,py)=>ctx.getImageData(px,py,1,1).data[3];
  const render=(style,values,opts={})=>{
    ctx.clearRect(0,0,440,220);
    ctx.save();
    drawPinePlot(ctx,{style,values,colors:values.map(()=>color),linewidth:4,...opts},0,values.length,x,y,bounds);
    ctx.restore();
  };
  for (const style of ["histogram","columns"]) {
    render(style,[10,30],{histbase:20});
    check(alpha(30,145)>0&&alpha(90,125)>0&&alpha(30,160)===0,"Bars must originate at histbase");
  }
  render("areabr",[30,null,40,50],{histbase:0});
  check(alpha(100,130)===0&&alpha(180,130)>0,"areabr connected across missing data");

  let path=[];
  const strokes=[],fills=[];
  const methods={};
  for(const name of ["beginPath","moveTo","lineTo","stroke","fill"])methods[name]=ctx[name].bind(ctx);
  ctx.beginPath=()=>{path=[];methods.beginPath();};
  ctx.moveTo=(px,py)=>{path.push([px,py]);methods.moveTo(px,py);};
  ctx.lineTo=(px,py)=>{path.push([px,py]);methods.lineTo(px,py);};
  ctx.stroke=()=>{strokes.push({path:[...path],dash:ctx.getLineDash(),width:ctx.lineWidth});methods.stroke();};
  ctx.fill=()=>{fills.push([...path]);methods.fill();};
  render("steplinebr",[10,null,20,30]);
  same(strokes.map(s=>s.path),[[[150,135],[180,135],[180,115],[210,115]]]);
  strokes.length=0;
  const [diamond]=projectPinePlots([{style:"stepline_diamond",values:[20,20],colors:[color,color],
    halo:[{index:-1,value:10,color}]}],0,2,2);
  render("stepline_diamond",diamond.values,{edgeValue:diamond.edgeValue,linestyle:"dotted"});
  same(fills.length,1);
  same(strokes[0].dash,[1,3]);
  check(fills[0].some(([px,py])=>px===30&&py===130),"Diamond missing on first visible change");

  for(const style of ["circles","cross"]){
    strokes.length=0;
    render(style,[10,20,null,30],{join:true,linestyle:"dashed"});
    same(strokes.filter(s=>s.path.length===2),[{path:[[30,155],[90,135]],dash:[],width:1}]);
  }
  strokes.length=0;
  render("line",[10,20],{linestyle:"dashed"});
  same(strokes[0].dash,[6,4]);

  const tracked={style:"line",offset:-5,show_last:1,trackprice:true,last:40,last_color:color,
    values:[10,20],colors:[color,color]};
  for(const origin of [0,2]){
    const [layer]=projectPinePlots([tracked],0,2,origin);
    same(layer.values,[null,null]);same(layer.trackPoint,{value:40,color});
    strokes.length=0;
    render("line",layer.values,layer);
    same(strokes,[{path:[[5,95],[420,95]],dash:[1,3],width:1}]);
  }
  same(pineTrackPoint({...tracked,last:null}),null);
  same(pineTrackPoint({...tracked,last_color:"#12345600"}),null);
  same(pineTrackPoint({...tracked,show_last:0}),null);
  const {last,last_color,...full}=tracked;
  same(pineTrackPoint(full),{value:20,color});

  const app=await (await fetch("/apps/ui/static/app.js")).text();
  const historyBlock=app.slice(app.indexOf("function chart("),app.indexOf('\nfor(const id of ["price-chart"'));
  const history=new Function("result","chartData","view","visible","colors","$","protectionSeries",
    "drawProtectionFills","number",historyBlock+";draw();");
  const axis=byId("output-chart").getContext("2d"),axes=[];
  const text=axis.fillText.bind(axis);
  axis.fillText=(value,...args)=>{if(Number.isFinite(Number(value)))axes.push(Number(value));text(value,...args);};
  const bars=[20,30].map((close,i)=>({time:i*60000,close}));
  const historyLayer={offset:0,show_last:null,histbase:-500,values:[20,30],colors:[color,color]};
  for(const [style,expectedMinimum] of [["areabr",20],["area",-500]]){
    axes.length=0;
    const result={status:"executed",result:{declaration:{overlay:false},observation_count:2,outputs:[{...historyLayer,style}]}};
    history(result,{data:{bars}},[0,2],[true],["blue"],byId,()=>[],()=>{},String);
    check(Math.abs(Math.min(...axes)-expectedMinimum)<0.0001,"Unexpected price domain for "+style);
  }

  const market=await (await fetch("/apps/ui/static/market.js")).text();
  const liveBlock=market.slice(market.indexOf("function livePineLayers("),market.indexOf("\nfunction drawLive("));
  const live=new Function("window","preview","count",liveBlock+';return livePineLayers(window,preview,count,0,["blue"]);');
  const presentation={schema_version:"openpine.plot-presentation.1",trackprice:true,offset:0,show_last:null,style:"line",linewidth:1};
  const confirmed={total:2,outputs:[{output_id:"p",last:20,last_color:color,presentation}],
    rows:[[0,0,"p",10],[1,60000,"p",20]],visual_rows:[[0,"p",color,null],[1,"p",color,null]]};
  const preview={outputs:[{output_id:"p",value:32,presentation:{...presentation,color:"#ABCDEF80"}}]};
  same(projectPinePlots(live(confirmed,preview,3),0,3)[0].trackPoint,{value:32,color:"#ABCDEF80"});
  preview.outputs[0].value=null;
  same(projectPinePlots(live(confirmed,preview,3),0,3)[0].trackPoint,null);
  same(projectPinePlots(live(confirmed,null,2),0,2)[0].trackPoint,{value:20,color});
  byId("results").textContent="PASS: baselines, broken areas and steps, diamonds, joins, dashes, and trackprice";
  document.body.dataset.result="passed";
})().catch(error=>{
  document.getElementById("results").textContent=error.stack;
  document.body.dataset.result="failed";
});
</script>
</html>
