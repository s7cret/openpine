<!doctype html><html lang="en"><meta charset="utf-8"><title>Label chart qualification</title>
<style>body{background:#121821;color:#dce4ef;font:16px system-ui}canvas{border:1px solid #485463;margin:10px;width:500px;height:250px}</style>
<h1>Label chart qualification</h1><pre id="results">Running</pre>
<canvas id="price-chart"></canvas><canvas id="output-chart"></canvas>
<canvas id="live-price-chart"></canvas><canvas id="live-output-chart"></canvas>
<div id="live-price-tables"></div><div id="live-output-tables"></div><div id="live-legend"></div>
<script src="/apps/ui/static/plots.js"></script><script>
(async () => {
  const byId = id => document.getElementById(id);
  const [app, market] = await Promise.all(["app", "market"].map(async file =>
    (await fetch(`/apps/ui/static/${file}.js`)).text()));
  const block = app.slice(app.indexOf("function chart("), app.indexOf('\nfor(const id of ["price-chart"'));
  const draw = new Function("result", "chartData", "view", "visible", "colors", "$", "protectionSeries",
    "drawProtectionFills", "number", block + ";draw();");
  const bars = [10, 20].map((close, i) => ({time: (i + 20) * 60000, close}));
  const paints = [], positions = new Map();
  for (const id of ["price-chart", "output-chart", "live-price-chart", "live-output-chart"]) {
    const ctx = byId(id).getContext("2d"), fill = ctx.fillText.bind(ctx);
    ctx.fillText = (text, ...args) => {
      paints.push([id, text]); positions.set(id + "/" + text, args[1]); fill(text, ...args);
    };
  }
  const render = (overlay, labels) => {
    paints.length = 0;
    draw({status: "executed", result: {outputs: [], declaration: {overlay}, labels}},
      {start: 20, data: {bars}}, [0, 2], [], [], byId, () => [], () => {}, String);
    return paints.filter(([, text]) => ["first", "updated", "hidden"].includes(text));
  };
  const label = {id: 1, x: 20, y: 10, text: "first"};
  const check = (actual, expected) => {
    if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(JSON.stringify(actual));
  };
  check(render(true, [label]), [["price-chart", "first"]]);
  check(render(false, [{...label, x: 21, y: 20, text: "updated"}]), [["output-chart", "updated"]]);
  check(render(true, [{...label, y: null, text: "hidden"}, {...label, x: 19, text: "hidden"}]), []);
  check(render(true, []), []);
  check(render(true, [{...label, x: 21, text: "updated"}]), [["price-chart", "updated"]]);

  const styled = {...label, xloc: "bar_time", chart_x: 20.5, x: 1234567, y: 15,
    style: "center", color: "#FF000080", textcolor: "#F0F0F0FF", size: 18};
  check(render(true, [styled]), [["price-chart", "first"]]);
  check(render(false, [{...styled, text: "updated"}]), [["output-chart", "updated"]]);
  check(render(true, [{...styled, chart_x: null, text: "hidden"}]), []);
  const timedBarLabel = {...styled, x: bars[1].time, chart_x: 21, y: null, yloc: "abovebar"};
  check(pineLabelWindow([timedBarLabel], bars, 20).map(row => [row.x, row.y]), [[1, 20]]);
  check(render(true, [timedBarLabel]), [["price-chart", "first"]]);
  check(render(false, [{...timedBarLabel, text: "updated", yloc: "belowbar"}]), [["output-chart", "updated"]]);
  check(render(true, [{...timedBarLabel, x: timedBarLabel.x - 1, text: "hidden"}]), []);
  check(render(true, [{...timedBarLabel, chart_x: 20.5, text: "hidden"}]), []);
  check(pineLabelWindow([{...timedBarLabel, yloc: "belowbar", y: 999}], bars.slice(1), 21).map(row => row.y), [20]);

  const liveBlock = market.slice(market.indexOf("function liveCanvas("), market.indexOf('\n$("live-start")'));
  const drawLiveFixture = new Function("liveWindow", "liveState", "liveFollow", "liveStart", "colors",
    "$", "number", liveBlock + ";drawLive();");
  const liveBars = bars.map(b => ({...b, high: b.close + 1, low: b.close - 1, open: b.close - .5}));
  const liveWindow = {bars: liveBars.slice(0, 1), label_overlay: true, labels: [styled], outputs: [], rows: [],
    preview: {time: bars[1].time, labels: [{...styled, text: "updated", color: null, size: "small"}], outputs: []}};
  const liveState = {preview_candle: {...liveBars[1], open_time: bars[1].time, closed: false}};
  const liveRender = (overlay, follow, window = liveWindow, state = liveState) => {
    paints.length = 0;
    positions.clear();
    drawLiveFixture({...window, label_overlay: overlay}, state, follow, 20, ["#fff"], byId, String);
    return paints.filter(([, text]) => ["first", "updated"].includes(text));
  };
  check(liveRender(true, true), [["live-price-chart", "updated"]]);
  check(liveRender(false, true), [["live-output-chart", "updated"]]);
  check(liveRender(true, false), [["live-price-chart", "first"]]);

  const time = bars[1].time + 60000;
  const above = {...styled, x: time, chart_x: 22, y: null, yloc: "abovebar", style: "none", size: "small"};
  const below = {...above, id: 2, text: "updated", yloc: "belowbar"};
  const evolving = {...liveWindow, bars: [{...liveBars[0], high: 100, low: 1}, liveBars[1]], labels: [],
    preview: {time, labels: [above, below], outputs: []}};
  const opened = {preview_candle: {open_time: time, open: 40, close: 40, high: 40, low: 40, closed: false}};
  const intrabar = {preview_candle: {...opened.preview_candle, high: 60, low: 25}};
  check(liveRender(true, true, evolving, opened), [["live-price-chart", "first"], ["live-price-chart", "updated"]]);
  const openAbove = positions.get("live-price-chart/first"), openBelow = positions.get("live-price-chart/updated");
  check(liveRender(true, true, evolving, intrabar), [["live-price-chart", "first"], ["live-price-chart", "updated"]]);
  check(positions.get("live-price-chart/first") < openAbove && positions.get("live-price-chart/updated") > openBelow, true);
  check(liveRender(false, true, evolving, opened), [["live-output-chart", "first"], ["live-output-chart", "updated"]]);
  const pane = [positions.get("live-output-chart/first"), positions.get("live-output-chart/updated")];
  check(pane[0] < 40 && pane[1] > 190, true);
  liveRender(false, true, evolving, intrabar);
  check([positions.get("live-output-chart/first"), positions.get("live-output-chart/updated")], pane);
  check(liveRender(true, false, evolving, intrabar), []);

  const sample = document.createElement("canvas");
  sample.width = sample.height = 120;
  const ctx = sample.getContext("2d");
  const calls = [], fillText = ctx.fillText.bind(ctx);
  ctx.fillText = (text, ...args) => { calls.push([text, ctx.font, ctx.fillStyle]); fillText(text, ...args); };
  const paint = (fields, x = 60, y = 60) => {
    ctx.clearRect(0, 0, 120, 120);
    calls.length = 0;
    drawPineLabels(ctx, [{...styled, x: 0, ...fields}], 0, 1, () => x, () => y, 10, 110, 10, 110);
  };
  const alpha = (x, y) => ctx.getImageData(x, y, 1, 1).data[3];
  const probes = [[60, 46], [60, 74], [46, 60], [74, 60]];
  for (const [style, ink] of Object.entries({up: 1, down: 0, left: 3, right: 2})) {
    paint({style, textcolor: null});
    check(probes.map(([x, y], i) => i === ink ? alpha(x, y) > 0 : alpha(x, y)), probes.map((_, i) => i === ink || 0));
    const [tx, ty] = [[60, 57], [60, 62], [57, 60], [62, 60]][ink];
    check(alpha(tx, ty) > 0, true);
    check(calls, []);
  }
  paint({style: "center", textcolor: null});
  check([...ctx.getImageData(60, 60, 1, 1).data], [255, 0, 0, 128]);
  paint({style: "left", textcolor: null}, 104);
  check(alpha(111, 60), 0);
  check(alpha(108, 60) > 0, true);
  paint({style: "none", textcolor: null});
  check(alpha(60, 60), 0);
  paint({style: "none", text: "first\nupdated", size: 0});
  check(calls.map(([text, font]) => [text, font]), [["first", "16px system-ui"], ["updated", "16px system-ui"]]);
  paint({style: "center", color: null, size: 200, text: "first"});
  check(calls[0][0], "first");
  check(Math.abs(parseFloat(calls[0][1]) - 64 * 4 / 3) < 0.001, true);
  check(calls[0][2], "#f0f0f0");
  paint({style: "center", color: "#FF000000", textcolor: "#00000000"});
  check(alpha(60, 60), 0);

  const typography = [];
  ctx.fillText = (text, x, y, width) => { typography.push([text, x, ctx.font, ctx.textAlign]); fillText(text, x, y, width); };
  for (const align of ["left", "center", "right"]) {
    paint({text: "longest\na", style: "center", textalign: align, text_font_family: "monospace", text_formatting: 3});
  }
  check(typography.map(([line, , , align]) => [line, align]),
    [["longest", "left"], ["a", "left"], ["longest", "center"], ["a", "center"], ["longest", "right"], ["a", "right"]]);
  check(typography.every(([, , font]) => font.includes("italic") && font.includes("bold") && font.endsWith("monospace")), true);
  check(typography[0][1] < typography[2][1] && typography[2][1] < typography[4][1], true);
  typography.length = 0;
  paint({style: undefined, text: "longest\na", textalign: null});
  paint({style: undefined, text: "longest\na", textalign: "center"});
  check(typography.map(([line]) => line), ["longest a", "longest", "a"]);

  const interactive = document.createElement("canvas"), hover = document.createElement("div");
  interactive.style.width = interactive.style.height = "120px";
  interactive.style.border = "0";
  interactive.width = interactive.height = 240;
  document.body.append(interactive, hover);
  const interactiveCtx = interactive.getContext("2d");
  interactiveCtx.scale(2, 2);
  bindPineLabelHover(interactive, hover, () => "candle");
  function move(canvas, x, y) {
    const rect = canvas.getBoundingClientRect();
    canvas.dispatchEvent(new PointerEvent("pointermove", {pointerId: 7, clientX: rect.left + x, clientY: rect.top + y}));
  }
  const common = {...styled, x: 0, style: "center", size: 18, text: "X"};
  const back = {...common, tooltip: "back"}, front = {...common, id: 2, tooltip: "<b>front</b>\nsecond"};
  const redraw = (labels, x = 60) => {
    interactiveCtx.clearRect(0, 0, 120, 120);
    publishPineLabelHits(interactive, drawPineLabels(interactiveCtx, labels, 0, 1, () => x, () => 60, 10, 110, 10, 110));
  };
  redraw([back, front]);
  move(interactive, 60, 60);
  check(hover.textContent, front.tooltip);
  check(hover.childElementCount, 0);
  redraw([back, {...front, tooltip: ""}]);
  check(hover.textContent, "candle");
  redraw([back]);
  check(hover.textContent, "back");
  redraw([front], 90);
  check(hover.textContent, "candle");
  redraw([]);
  check(hover.textContent, "candle");
  redraw([{...front, style: "left"}], 104);
  move(interactive, 107, 60);
  check(hover.textContent, front.tooltip);
  move(interactive, 112, 60);
  check(hover.textContent, "candle");
  redraw([{...front, style: "up"}]);
  move(interactive, 60, 62);
  check(hover.textContent, front.tooltip);
  move(interactive, 68, 62);
  check(hover.textContent, "candle");
  redraw([{...front, style: "none", textcolor: "#FFFFFFFF"}]);
  move(interactive, 60, 60);
  check(hover.textContent, front.tooltip);
  redraw([{...front, style: "none", textcolor: "#FFFFFF00"}]);
  check(hover.textContent, "candle");
  interactive.dispatchEvent(new PointerEvent("pointerleave", {pointerId: 7}));
  check(hover.hidden, true);

  const historicalCanvas = byId("price-chart"), livePane = byId("live-output-chart");
  const historyHover = document.createElement("div"), liveHover = document.createElement("div");
  bindPineLabelHover(historicalCanvas, historyHover, () => "history candle");
  bindPineLabelHover(livePane, liveHover);
  const findBody = canvas => {
    const {left, right, top, bottom} = pineLabelHovers.get(canvas).hits[0];
    const ctx = canvas.getContext("2d"), {a, d} = ctx.getTransform(), path = pineLabelHovers.get(canvas).hits[0].path;
    for (let y = top + 2; y < bottom - 2; y += 2)
      for (let x = left + 2; x < right - 2; x += 2)
        if ([-1, 1].every(delta => ctx.isPointInPath(path, (x + delta) * a, (y + delta) * d))) return [x, y];
    throw new Error("Label body is outside the pane.");
  };
  render(true, [{...styled, tooltip: "historical"}]);
  move(historicalCanvas, ...findBody(historicalCanvas));
  check(historyHover.textContent, "historical");
  render(true, []);
  check(historyHover.textContent, "history candle");
  const previewHint = {...above, style: "center", tooltip: "preview"};
  const hoverWindow = {...evolving, preview: {...evolving.preview, labels: [previewHint]}};
  liveRender(false, true, hoverWindow, opened);
  move(livePane, ...findBody(livePane));
  check(liveHover.textContent, "preview");
  liveRender(false, true, {...hoverWindow, preview: {...hoverWindow.preview, labels: []}}, opened);
  check(liveHover.hidden, true);

  const forced = {...styled, force_overlay: true, tooltip: "forced price"};
  const ordinary = {...styled, id: 2, text: "updated", y: 5000, tooltip: "ordinary pane"};
  render(false, [forced]);
  const standalonePriceY = positions.get("price-chart/first");
  check(render(false, [forced, ordinary]), [["price-chart", "first"], ["output-chart", "updated"]]);
  check(positions.get("price-chart/first"), standalonePriceY);
  move(historicalCanvas, ...findBody(historicalCanvas));
  check(historyHover.textContent, "forced price");
  const outputCanvas = byId("output-chart"), outputHover = document.createElement("div");
  bindPineLabelHover(outputCanvas, outputHover);
  render(false, [forced, ordinary]);
  move(outputCanvas, ...findBody(outputCanvas));
  check(outputHover.textContent, "ordinary pane");
  check(render(true, [forced, ordinary]), [["price-chart", "first"], ["price-chart", "updated"]]);

  const forcedPreview = {...above, style: "center", force_overlay: true, tooltip: "forced preview"};
  const mixed = {...evolving, labels: [forced, ordinary], preview: {...evolving.preview, labels: [forcedPreview, ordinary]}};
  const livePrice = byId("live-price-chart"), priceHover = document.createElement("div");
  bindPineLabelHover(livePrice, priceHover);
  check(liveRender(false, true, mixed, opened), [["live-price-chart", "first"], ["live-output-chart", "updated"]]);
  move(livePrice, ...findBody(livePrice));
  check(priceHover.textContent, "forced preview");
  check(liveRender(false, false, mixed, opened), [["live-price-chart", "first"], ["live-output-chart", "updated"]]);
  move(livePrice, ...findBody(livePrice));
  check(priceHover.textContent, "forced price");

  byId("results").textContent = "PASS: label geometry, live updates, text and fonts, clipped hover and mixed panes";
  document.body.dataset.result = "passed";
})().catch(error => {
  document.getElementById("results").textContent = error.stack;
  document.body.dataset.result = "failed";
});
</script>
