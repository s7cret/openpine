<!doctype html><html lang="en"><meta charset="utf-8"><title>Label chart qualification</title>
<style>body{background:#121821;color:#dce4ef;font:16px system-ui}canvas{border:1px solid #485463;margin:10px;width:500px;height:250px}</style>
<h1>Label chart qualification</h1><pre id="results">Running</pre>
<canvas id="price-chart"></canvas><canvas id="output-chart"></canvas>
<canvas id="live-price-chart"></canvas><canvas id="live-output-chart"></canvas>
<div id="live-price-tables"></div><div id="live-output-tables"></div><div id="live-legend"></div>
<script src="/apps/ui/static/plots.js"></script><script>
(async () => {
  const byId = id => document.getElementById(id);
  const app = await (await fetch("/apps/ui/static/app.js")).text();
  const block = app.slice(app.indexOf("function chart("), app.indexOf('\nfor(const id of ["price-chart"'));
  const draw = new Function("result", "chartData", "view", "visible", "colors", "$", "protectionSeries",
    "drawProtectionFills", "number", block + ";draw();");
  const bars = [10, 20].map((close, i) => ({time: (i + 20) * 60000, close}));
  const paints = [];
  for (const id of ["price-chart", "output-chart", "live-price-chart", "live-output-chart"]) {
    const ctx = byId(id).getContext("2d"), fill = ctx.fillText.bind(ctx);
    ctx.fillText = (text, ...args) => { paints.push([id, text]); fill(text, ...args); };
  }
  const render = (overlay, labels) => {
    paints.length = 0;
    draw({status: "executed", result: {outputs: [], declaration: {overlay}, labels}},
      {start: 20, data: {bars}}, [0, 2], [], [], byId, () => [], () => {}, String);
    return paints.filter(([, text]) => ["first", "updated", "hidden"].includes(text));
  };
  const label = {id: 1, x: 20, y: 10, text: "first"};
  const check = (actual, expected) => {
    if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(JSON.stringify(actual));
  };
  check(render(true, [label]), [["price-chart", "first"]]);
  check(render(false, [{...label, x: 21, y: 20, text: "updated"}]), [["output-chart", "updated"]]);
  check(render(true, [{...label, y: null, text: "hidden"}, {...label, x: 19, text: "hidden"}]), []);
  check(render(true, []), []);
  check(render(true, [{...label, x: 21, text: "updated"}]), [["price-chart", "updated"]]);

  const styled = {...label, xloc: "bar_time", chart_x: 20.5, x: 1234567, y: 15,
    style: "center", color: "#FF000080", textcolor: "#F0F0F0FF", size: 18};
  check(render(true, [styled]), [["price-chart", "first"]]);
  check(render(false, [{...styled, text: "updated"}]), [["output-chart", "updated"]]);
  check(render(true, [{...styled, chart_x: null, text: "hidden"}]), []);

  const market = await (await fetch("/apps/ui/static/market.js")).text();
  const liveBlock = market.slice(market.indexOf("function liveCanvas("), market.indexOf('\n$("live-start")'));
  const drawLiveFixture = new Function("liveWindow", "liveState", "liveFollow", "liveStart", "colors",
    "$", "number", liveBlock + ";drawLive();");
  const liveBars = bars.map(b => ({...b, high: b.close + 1, low: b.close - 1, open: b.close - .5}));
  const liveWindow = {bars: liveBars.slice(0, 1), label_overlay: true, labels: [styled], outputs: [], rows: [],
    preview: {time: bars[1].time, labels: [{...styled, text: "updated", color: null, size: "small"}], outputs: []}};
  const liveState = {preview_candle: {...liveBars[1], open_time: bars[1].time, closed: false}};
  const liveRender = (overlay, follow) => {
    paints.length = 0;
    drawLiveFixture({...liveWindow, label_overlay: overlay}, liveState, follow, 20, ["#fff"], byId, String);
    return paints.filter(([, text]) => ["first", "updated"].includes(text));
  };
  check(liveRender(true, true), [["live-price-chart", "updated"]]);
  check(liveRender(false, true), [["live-output-chart", "updated"]]);
  check(liveRender(true, false), [["live-price-chart", "first"]]);

  const sample = document.createElement("canvas");
  sample.width = sample.height = 120;
  const ctx = sample.getContext("2d");
  const calls = [], fillText = ctx.fillText.bind(ctx);
  ctx.fillText = (text, ...args) => { calls.push([text, ctx.font, ctx.fillStyle]); fillText(text, ...args); };
  const paint = (fields, x = 60, y = 60) => {
    ctx.clearRect(0, 0, 120, 120);
    calls.length = 0;
    drawPineLabels(ctx, [{...styled, x: 0, ...fields}], 0, 1, () => x, () => y, 10, 110, 10, 110);
  };
  const alpha = (x, y) => ctx.getImageData(x, y, 1, 1).data[3];
  const probes = [[60, 46], [60, 74], [46, 60], [74, 60]];
  for (const [style, ink] of Object.entries({up: 1, down: 0, left: 3, right: 2})) {
    paint({style, textcolor: null});
    check(probes.map(([x, y], i) => i === ink ? alpha(x, y) > 0 : alpha(x, y)), probes.map((_, i) => i === ink || 0));
    const [tx, ty] = [[60, 57], [60, 62], [57, 60], [62, 60]][ink];
    check(alpha(tx, ty) > 0, true);
    check(calls, []);
  }
  paint({style: "center", textcolor: null});
  check([...ctx.getImageData(60, 60, 1, 1).data], [255, 0, 0, 128]);
  paint({style: "left", textcolor: null}, 104);
  check(alpha(111, 60), 0);
  check(alpha(108, 60) > 0, true);
  paint({style: "none", textcolor: null});
  check(alpha(60, 60), 0);
  paint({style: "none", text: "first\nupdated", size: 0});
  check(calls.map(([text, font]) => [text, font]), [["first", "16px system-ui"], ["updated", "16px system-ui"]]);
  paint({style: "center", color: null, size: 200, text: "first"});
  check(calls[0][0], "first");
  check(Math.abs(parseFloat(calls[0][1]) - 64 * 4 / 3) < 0.001, true);
  check(calls[0][2], "#f0f0f0");
  paint({style: "center", color: "#FF000000", textcolor: "#00000000"});
  check(alpha(60, 60), 0);
  byId("results").textContent = "PASS: legacy labels, both panes, time projection, pointer paths, clipping, RGBA and sizes";
  document.body.dataset.result = "passed";
})().catch(error => {
  document.getElementById("results").textContent = error.stack;
  document.body.dataset.result = "failed";
});
</script>
